<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深度マッププレビュー＆一括ZIP</title>
<link rel="stylesheet" href="../../css/common-style.css">
<link rel="stylesheet" href="../../css/common-style2.css">
<style>
[hidden]{display:none!important}
body{box-sizing:border-box}
#status{max-width:600px;overflow-wrap:anywhere}
#popup{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:10;padding:20px}
#popupContent{background:white;padding:24px;border-radius:10px;max-width:90%;overflow-wrap:anywhere}
progress{width:100%}
</style>
</head>
<body>
<h1>深度マップ → PNG・ZIP</h1>
<div id="dropArea" role="button" tabindex="0">.npy ファイルをドラッグ＆ドロップ<br>またはクリックして選択（複数可）</div>
<input id="fileInput" type="file" accept=".npy" multiple hidden>
<p id="status" role="status" aria-live="polite">ファイルを追加すると、最初の画像のプレビューとZIPを自動で作成します。</p>
<canvas id="canvas" hidden></canvas>
<button id="downloadBtn" disabled>ZIPをダウンロード</button>
<div id="popup" hidden><div id="popupContent"><p id="progressText" role="status" aria-live="polite">変換中…</p><progress id="progress" value="0" max="1"></progress></div></div>
<script src="./vendor/jszip.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
