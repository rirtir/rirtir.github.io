<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSS重複削除ツール</title>

<style>

body{
font-family:sans-serif;
margin:0;
padding:30px;
background:#f5f5f5;
display:flex;
flex-direction:column;
align-items:center;
}

h1{
margin-bottom:20px;
}

.container{
display:flex;
gap:20px;
margin-bottom:20px;
max-width:100%;
flex-wrap:wrap;
justify-content:center;
}

.drop{
width:220px;
height:120px;
border:3px dashed #888;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
background:white;
cursor:pointer;
text-align:center;
}

button{
padding:10px 25px;
font-size:16px;
cursor:pointer;
}

</style>
</head>

<body>

<h1>CSS重複削除ツール</h1>

<div class="container">
<div class="drop" id="dropA">残したい方 <br> (HTML / CSS)</div>
<div class="drop" id="dropB">比較対象 <br> (HTML / CSS)</div>
</div>

<button id="run">処理</button>
<p>入れ子の規則や、削除すると適用順に影響する宣言は保持します。</p>
<p id="status" role="status" aria-live="polite"></p>

<script src="./css-diff.js"></script>
<script>

let textA=""
let textB=""



function setupDrop(id,callback){

const el=document.getElementById(id)

el.onclick=()=>{
const input=document.createElement("input")
input.type="file"
input.accept=".html,.css"
input.onchange=e=>{
const file=e.target.files[0]
readFile(file,callback)
}
input.click()
}

el.ondragover=e=>{
e.preventDefault()
}

el.ondrop=e=>{
e.preventDefault()
const file=e.dataTransfer.files[0]
readFile(file,callback)
}

}



function readFile(file,callback){

if(!file)return

const reader=new FileReader()

reader.onload=e=>{
callback(e.target.result)
}

reader.readAsText(file)

}



setupDrop("dropA",text=>{
textA=text
document.getElementById("dropA").textContent="A 読み込み完了"
})

setupDrop("dropB",text=>{
textB=text
document.getElementById("dropB").textContent="B 読み込み完了"
})



function extractCSS(text){

const styles=[...text.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)]

if(styles.length>0){
return styles.map(s=>s[1]).join("\n")
}

return text

}



document.getElementById("run").onclick=()=>{

if(!textA || !textB){
alert("AとBを読み込んでください")
return
}

const cssA=extractCSS(textA)
const cssB=extractCSS(textB)

let output
try{output=removeDuplicatedCSS(cssA,cssB)}
catch(error){document.getElementById("status").textContent=error.message;return}

const blob=new Blob([output],{type:"text/css"})

const link=document.createElement("a")

link.href=URL.createObjectURL(blob)
link.download="result.css"

link.click()
document.getElementById("status").textContent="CSSを保存しました。"
setTimeout(()=>URL.revokeObjectURL(link.href),1000)

}

</script>

</body>
</html>
