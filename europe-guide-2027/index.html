const storageKey='europe-guide-2027.saved-password', remember=document.querySelector('#remember');

const forget=()=>{try{localStorage.removeItem(storageKey);}catch(_){}};
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openGuide(password,keep,automatic=false){
 status.textContent='開いています…';button.disabled=true;
 if(!window.crypto?.subtle){status.textContent='HTTPSのURLで開いてください。';button.disabled=false;return;}
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(encrypted.salt),iterations:encrypted.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);

  field.value='';const source=new TextDecoder('utf-8',{fatal:true}).decode(plain);

  const forgetButton=document.querySelector('#jump-forget');
