const storageKey='europe-guide-2027.saved-password', remember=document.querySelector('#remember');
const saved=()=>{try{return localStorage.getItem(storageKey);}catch(_){return null;}};
const forget=()=>{try{localStorage.removeItem(storageKey);}catch(_){}};
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openGuide(password,keep,automatic=false){
 status.textContent='開いています…';button.disabled=true;
 if(!window.crypto?.subtle){status.textContent='HTTPSのURLで開いてください。';button.disabled=false;return;}
