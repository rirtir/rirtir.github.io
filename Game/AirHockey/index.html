<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">マウスまたはタッチで操作するエアホッケーゲーム改良版。難易度を選んでCPUと対戦し、先に7点取った方が勝ちです。</h2>
<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:1rem 0;">
  <div id="diffRow" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
    <button data-d="0">よわい</button>
    <button data-d="1">ふつう</button>
    <button data-d="2">つよい</button>
    <button data-d="3">さいきょう</button>
    <button id="muteBtn" aria-label="サウンド切替"><i class="ti ti-volume" aria-hidden="true" style="font-size:18px;vertical-align:-3px;"></i></button>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:12px;">
    <canvas id="cv" style="display:block;border-radius:var(--border-radius-md);touch-action:none;cursor:none;max-width:100%;"></canvas>
  </div>
  <p id="hint" style="font-size:13px;color:var(--color-text-secondary);margin:0;">難易度を選ぶとスタート。マウスはコートの外でも追従します(先に7点で勝ち)</p>
</div>
<script>
(() => {
const W=400, H=580, GOAL=130, PR=24, AR=26, PKR=15;
const cv=document.getElementById('cv');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr; cv.height=H*dpr;
cv.style.width=Math.min(W, 360)+'px';
const scale=Math.min(W,360)/W;
cv.style.height=(H*scale)+'px';
const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);

let muted=false, AC=null;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function blip(freq,dur,type,vol,slide){
  if(muted) return;
  try{
    const a=ac(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noiseHit(vol){
  if(muted) return;
  try{
    const a=ac(), t=a.currentTime, len=a.sampleRate*0.08;
    const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=a.createBufferSource(), g=a.createGain();
    s.buffer=buf; g.gain.value=vol||0.1;
    s.connect(g); g.connect(a.destination); s.start(t);
  }catch(e){}
}
function jingle(notes,step,type){
  notes.forEach((n,i)=> setTimeout(()=>blip(n,0.14,type||'square',0.13), i*step));
}

const DIFFS=[
  {name:'よわい', spd:2.6, err:70, react:0.5, atk:0.5, col:'#5DCAA5'},
  {name:'ふつう', spd:4.6, err:34, react:0.75, atk:0.8, col:'#85B7EB'},
  {name:'つよい', spd:7.2, err:12, react:0.92, atk:1.0, col:'#EF9F27'},
  {name:'さいきょう', spd:10.5, err:3, react:1.0, atk:1.25, col:'#E24B4A'}
];
let diff=null, state='menu';
let puck={x:W/2,y:H/2,vx:0,vy:0};
let pl={x:W/2,y:H-90,vx:0,vy:0};
let aiP={x:W/2,y:90,vx:0,vy:0};
let scoreP=0, scoreA=0, particles=[], trail=[], shake=0, flashMsg='', flashT=0;
let pointer={x:W/2,y:H-90};
let hitCd=0, wallCd=0, aiMode='normal', aiT=0, stuck=0;

function resetPuck(toPlayer){
  puck.x=W/2; puck.y=H/2+(toPlayer?70:-70); puck.vx=0; puck.vy=0;
  pl.x=W/2; pl.y=H-90; pointer={x:W/2,y:H-90};
  aiP.x=W/2; aiP.y=90;
  aiMode='normal'; stuck=0;
  trail=[];
}
function startGame(d){
  diff=DIFFS[d]; scoreP=0; scoreA=0; state='play';
  resetPuck(true);
  document.querySelectorAll('#diffRow button[data-d]').forEach((b,i)=>{
    b.style.borderColor = i===d ? diff.col : '';
    b.style.fontWeight = i===d ? '500' : '400';
  });
  jingle([523,659,784,1047],70);
}
document.querySelectorAll('#diffRow button[data-d]').forEach(b=>{
  b.addEventListener('click',()=>{ ac(); startGame(+b.dataset.d); });
});
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{
  muted=!muted;
  muteBtn.innerHTML='<i class="ti '+(muted?'ti-volume-off':'ti-volume')+'" aria-hidden="true" style="font-size:18px;vertical-align:-3px;"></i>';
  if(!muted) blip(880,0.08,'square',0.1);
});

function toCanvas(cx,cy){
  const r=cv.getBoundingClientRect();
  return {x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H};
}
window.addEventListener('pointermove',e=>{ pointer=toCanvas(e.clientX,e.clientY); });
window.addEventListener('pointerdown',e=>{ pointer=toCanvas(e.clientX,e.clientY); });
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; pointer=toCanvas(t.clientX,t.clientY); },{passive:false});

function spawnParticles(x,y,col,n,pow){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(Math.random()*0.7+0.3)*(pow||4);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col});
  }
}

function calcVel(p,tx,ty,maxSpd,minX,maxX,minY,maxY){
  let nx=tx, ny=ty;
  const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
  if(maxSpd&&d>maxSpd){ nx=p.x+dx/d*maxSpd; ny=p.y+dy/d*maxSpd; }
  nx=Math.max(minX,Math.min(maxX,nx));
  ny=Math.max(minY,Math.min(maxY,ny));
  p.vx=nx-p.x; p.vy=ny-p.y;
}

function collide(p,r){
  const dx=puck.x-p.x, dy=puck.y-p.y, d=Math.hypot(dx,dy), min=r+PKR;
  if(d<min&&d>0.001){
    const nx=dx/d, ny=dy/d;
    puck.x=p.x+nx*min; puck.y=p.y+ny*min;
    const dot=puck.vx*nx+puck.vy*ny;
    if(dot<0){ puck.vx-=2*dot*nx; puck.vy-=2*dot*ny; }
    puck.vx+=p.vx*0.9; puck.vy+=p.vy*0.9;
    puck.vx+=nx*1.2; puck.vy+=ny*1.2;
    const spd=Math.hypot(puck.vx,puck.vy), cap=16;
    if(spd>cap){ puck.vx*=cap/spd; puck.vy*=cap/spd; }
    if(hitCd<=0){
      blip(220+Math.random()*60,0.07,'square',0.12,-80);
      noiseHit(0.08);
      spawnParticles(puck.x,puck.y,'#FFD93D',8,5);
      shake=4; hitCd=6;
    }
  }
}

function aiThink(){
  const d=diff, homeY=80;
  const spd=Math.hypot(puck.vx,puck.vy);
  if(puck.y<H/2 && spd<0.7) stuck++; else stuck=Math.max(0,stuck-2);
  if(aiMode==='normal' && stuck>40){ aiMode='back'; aiT=28; }
  let tx, ty, ms=d.spd;
  const gx=W/2, gy=H+40;
  if(aiMode==='back'){
    tx=W/2; ty=homeY; ms=d.spd*1.3+2;
    if(--aiT<=0){ aiMode='dash'; aiT=55; }
  } else if(aiMode==='dash'){
    const dx=puck.x-gx, dy=puck.y-gy, l=Math.hypot(dx,dy)||1;
    tx=puck.x+dx/l*6; ty=puck.y+dy/l*6;
    ms=Math.max(d.spd,8);
    if(spd>3.5||--aiT<=0){ aiMode='normal'; stuck=0; }
  } else {
    const noise=(Math.random()*2-1)*d.err;
    if(puck.y < H/2+40){
      const dx=puck.x-(gx+noise*1.5), dy=puck.y-gy, l=Math.hypot(dx,dy)||1;
      tx=puck.x+dx/l*8+noise*0.3;
      ty=puck.y+dy/l*8;
      ms=d.spd*d.atk;
      if(puck.y<aiP.y-6 && Math.abs(puck.x-aiP.x)<AR+PKR){
        tx=puck.x+(puck.x<W/2?1:-1)*(AR+PKR+8);
        ty=puck.y;
      }
    } else {
      const predX=Math.max(PKR,Math.min(W-PKR,puck.x+puck.vx*10));
      tx=W/2+(predX-W/2)*0.5+noise; ty=homeY; ms=d.spd*0.85;
    }
    if(Math.random()>d.react){ tx=aiP.x; ty=aiP.y; }
  }
  calcVel(aiP,tx,ty,ms,AR,W-AR,AR+6,H/2-AR-2);
}

function wallsAndGoals(){
  const gl=(W-GOAL)/2, gr=(W+GOAL)/2;
  let bounced=false;
  if(puck.x<PKR){ puck.x=PKR; puck.vx=Math.abs(puck.vx); bounced=true; }
  if(puck.x>W-PKR){ puck.x=W-PKR; puck.vx=-Math.abs(puck.vx); bounced=true; }
  if(puck.y<PKR){
    if(puck.x>gl&&puck.x<gr){ if(puck.y<-PKR) return 'goalP'; }
    else { puck.y=PKR; puck.vy=Math.abs(puck.vy); bounced=true; }
  }
  if(puck.y>H-PKR){
    if(puck.x>gl&&puck.x<gr){ if(puck.y>H+PKR) return 'goalA'; }
    else { puck.y=H-PKR; puck.vy=-Math.abs(puck.vy); bounced=true; }
  }
  if(bounced&&wallCd<=0){ blip(440,0.05,'square',0.08,-100); wallCd=5; }
  return null;
}

function goal(byPlayer){
  state='goal'; flashT=80;
  if(byPlayer){ scoreP++; flashMsg='ゴール！'; jingle([784,988,1175,1568],75); }
  else { scoreA++; flashMsg='しっぱい…'; jingle([330,262,196,131],110,'triangle'); }
  spawnParticles(puck.x,puck.y,byPlayer?'#5DCAA5':'#E24B4A',30,7);
  shake=10;
  setTimeout(()=>{
    if(scoreP>=7||scoreA>=7){
      state='over';
      flashMsg=scoreP>=7?'きみの かち！':'CPUの かち';
      if(scoreP>=7) jingle([523,659,784,1047,784,1047,1319],110);
      else jingle([392,370,349,330,311,294,262],130,'triangle');
    } else { resetPuck(!byPlayer); state='play'; }
  },900);
}

function update(){
  if(shake>0) shake*=0.85;
  if(flashT>0) flashT--;
  if(hitCd>0) hitCd--;
  if(wallCd>0) wallCd--;
  particles=particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96; p.life-=0.03; return p.life>0; });
  if(state!=='play') return;

  calcVel(pl, pointer.x, pointer.y, 0, PR, W-PR, H/2+PR+2, H-PR-6);
  aiThink();

  const rel=Math.max(
    Math.hypot(pl.vx-puck.vx, pl.vy-puck.vy),
    Math.hypot(aiP.vx-puck.vx, aiP.vy-puck.vy),
    Math.hypot(puck.vx,puck.vy));
  const n=Math.min(16, Math.max(1, Math.ceil(rel/(PKR*0.5))));
  for(let i=0;i<n;i++){
    pl.x+=pl.vx/n; pl.y+=pl.vy/n;
    aiP.x+=aiP.vx/n; aiP.y+=aiP.vy/n;
    puck.x+=puck.vx/n; puck.y+=puck.vy/n;
    const g=wallsAndGoals();
    if(g){ goal(g==='goalP'); return; }
    collide(pl,PR); collide(aiP,AR);
  }
  puck.vx*=0.993; puck.vy*=0.993;
  trail.push({x:puck.x,y:puck.y}); if(trail.length>10) trail.shift();
}

function circle(x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||3; ctx.stroke(); }
}

function draw(){
  ctx.save();
  if(shake>0.5) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.fillStyle='#10182B'; ctx.fillRect(-10,-10,W+20,H+20);

  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  circle(W/2,H/2,60,null,'rgba(255,255,255,0.18)',2);
  const gl=(W-GOAL)/2, gr=(W+GOAL)/2;
  circle(W/2,0,90,null,'rgba(255,255,255,0.1)',2);
  circle(W/2,H,90,null,'rgba(255,255,255,0.1)',2);
  ctx.lineWidth=8; ctx.lineCap='round';
  ctx.strokeStyle='#534AB7';
  ctx.beginPath(); ctx.moveTo(gl,4); ctx.lineTo(gr,4); ctx.stroke();
  ctx.strokeStyle='#1D9E75';
  ctx.beginPath(); ctx.moveTo(gl,H-4); ctx.lineTo(gr,H-4); ctx.stroke();

  ctx.font='500 30px monospace'; ctx.textAlign='center';
  ctx.fillStyle='rgba(175,169,236,0.5)'; ctx.fillText(scoreA, W/2, H/2-22);
  ctx.fillStyle='rgba(93,202,165,0.5)'; ctx.fillText(scoreP, W/2, H/2+44);

  trail.forEach((t,i)=>{ ctx.globalAlpha=i/trail.length*0.25; circle(t.x,t.y,PKR*(i/trail.length),'#FFD93D'); });
  ctx.globalAlpha=1;

  particles.forEach(p=>{ ctx.globalAlpha=p.life; circle(p.x,p.y,3.5,p.col); });
  ctx.globalAlpha=1;

  circle(aiP.x,aiP.y,AR,'#3C3489','#AFA9EC',3);
  circle(aiP.x,aiP.y,AR*0.45,'#534AB7');
  circle(pl.x,pl.y,PR,'#085041','#5DCAA5',3);
  circle(pl.x,pl.y,PR*0.45,'#1D9E75');
  if(state!=='menu') circle(puck.x,puck.y,PKR,'#FFD93D','#B8860B',2);

  if(state==='menu'){
    ctx.fillStyle='rgba(16,24,43,0.75)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#FFD93D'; ctx.font='500 32px monospace';
    ctx.fillText('AIR HOCKEY',W/2,H/2-30);
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.font='16px monospace';
    ctx.fillText('▲ 上のボタンで なんいど をえらぶ',W/2,H/2+16);
  }
  if(flashT>0 && (state==='goal'||state==='over')){
    ctx.fillStyle='rgba(16,24,43,0.5)'; ctx.fillRect(0,H/2-60,W,110);
    ctx.fillStyle='#FFD93D'; ctx.font='500 34px monospace';
    ctx.fillText(flashMsg,W/2,H/2);
    if(state==='over'){ flashT=80;
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='15px monospace';
      ctx.fillText('もういちど あそぶには なんいど をえらんでね',W/2,H/2+32);
    }
  }
  if(state==='play'&&diff){
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font='13px monospace'; ctx.textAlign='left';
    ctx.fillText('CPU: '+diff.name, 10, 22);
  }
  ctx.restore();
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
})();
</script>
