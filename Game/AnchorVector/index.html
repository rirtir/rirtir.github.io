<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050812">
  <meta name="description" content="指で立体経路を描き、無人機が高速で敵を斬り抜けるスマートフォン向け3Dアクション・ローグライト。">
  <meta property="og:title" content="ANCHOR//VECTOR — 星環の残響">
  <meta property="og:description" content="操作は静か、結果は激しい。一筆経路型3Dアクション。">
  <meta property="og:image" content="https://rirtir.com/Game/AnchorVector/assets/og-image.jpg">
  <meta property="og:type" content="website">
  <title>ANCHOR//VECTOR — 星環の残響</title>
  <link rel="preload" href="./assets/key-art.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-screen="boot">
  <div id="app">
    <canvas id="game-canvas" aria-label="ANCHOR VECTOR 3D戦闘画面"></canvas>
    <div id="art-backdrop" aria-hidden="true"></div>
    <main id="screen-layer" aria-live="polite">
      <section class="screen boot-screen">
        <div class="boot-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="eyebrow">SYSTEM INITIALIZING</p>
        <h1>ANCHOR<span>//</span>VECTOR</h1>
        <p id="boot-status">軌道データを読み込んでいます</p>
      </section>
    </main>

    <section id="battle-hud" class="battle-hud" hidden aria-label="戦闘情報">
      <div class="hud-top">
        <div id="shield-display" class="shield-display" aria-label="シールド"></div>
        <div class="encounter-display">
          <span id="encounter-label" class="eyebrow">ENCOUNTER 1/7</span>
          <strong id="enemy-count">敵 0</strong>
        </div>
        <button class="icon-button pause-button" data-action="pause" aria-label="一時停止">
          <svg aria-hidden="true"><use href="./assets/ui-icons.svg#pause"></use></svg>
        </button>
      </div>
      <div id="boss-bar" class="boss-bar" hidden><span id="boss-name">BOSS</span><i><b id="boss-fill"></b></i></div>
      <div id="route-readout" class="route-readout" hidden>
        <span id="route-nodes">0 / 3 NODE</span>
        <strong id="route-length">0.0 m</strong>
      </div>
      <div class="hud-bottom">
        <div id="flow-meter" class="flow-meter" style="--flow:0">
          <div><span>FLOW</span><strong id="flow-value">0</strong></div>
        </div>
        <div id="chain-display" class="chain-display" hidden><span>CHAIN</span><strong id="chain-value">0</strong></div>
        <button id="overtrace-button" class="overtrace-button" data-action="overtrace" disabled>
          <span>OVERTRACE</span><small>逆走再演算</small>
        </button>
      </div>
      <div id="tutorial-prompt" class="tutorial-prompt" hidden></div>
    </section>

    <div id="toast-stack" class="toast-stack" aria-live="assertive"></div>
    <div id="modal-layer" class="modal-layer" hidden></div>
    <div id="context-message" class="context-message" hidden>
      <strong>描画を一時停止しました</strong>
      <span>画面へ戻ると復旧を試みます。</span>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
