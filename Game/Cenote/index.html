<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>セノーテ ― 光の降る地下の泉</title>
<meta name="description" content="天井の穴から光の柱が降り注ぐ、メキシコの地下泉（セノーテ）をブラウザで歩き回れる、リアルタイム3D散策体験。水中にも潜れます。">
<meta property="og:title" content="セノーテ ― 光の降る地下の泉">
<meta property="og:description" content="実写と見まがう洞窟の泉を、ブラウザで自由に散策。水中にも潜れます。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://rirtir.com/Game/Cenote/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#04121a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2303161c%27/%3E%3Cpath d=%27M12 2h8l4 20H8z%27 fill=%27%23bff5ea%27 opacity=%27.55%27/%3E%3Cellipse cx=%2716%27 cy=%2725%27 rx=%2710%27 ry=%274%27 fill=%27%232bb6c6%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="depth"></div>
  <div id="toast"></div>
  <div id="views"></div>
  <div id="timebox">
    <span class="tb-sun">☀</span>
    <input id="tod" type="range" min="0.12" max="0.88" step="0.001" value="0.5" aria-label="時刻">
    <span id="todlabel">12:00</span>
    <button id="todauto" type="button" title="時間を進める (T)">▶</button>
  </div>
  <div id="touchbtns">
    <button id="tbUp" type="button" aria-label="上昇">▲</button>
    <button id="tbDown" type="button" aria-label="下降">▼</button>
  </div>
  <div id="help">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>Space</kbd> 上昇　<kbd>C</kbd> 下降　<kbd>Shift</kbd> 加速</div>
    <div>マウス 視点　ホイール 速度　<kbd>1</kbd>〜<kbd>5</kbd> 見どころへ　<kbd>[</kbd><kbd>]</kbd> 時刻　<kbd>P</kbd> 写真　<kbd>H</kbd> 表示切替　<kbd>M</kbd> 音　<kbd>G</kbd> 画質　<kbd>F</kbd> ボケ</div>
  </div>
</div>

<div id="intro">
  <div class="intro-inner">
    <div class="eyebrow">CENOTE · 地下水の洞窟</div>
    <h1>光の降る<br>地下の泉</h1>
    <p class="lead">天井にぽっかり空いた穴から、光の柱が水面へ降り注ぐ。<br>そのすべてを、ブラウザの中でリアルタイムに描画しています。</p>
    <div id="loadwrap">
      <div id="loadbar"><div id="loadfill"></div></div>
      <div id="loadtext">洞窟を掘っています…</div>
    </div>
    <button id="start" class="hidden" type="button">洞窟に入る</button>
    <div class="tips">
      <span>水面の下にも潜れます</span><span>光の柱の中へ入ってみてください</span><span>ヘッドホン推奨</span>
    </div>
    <div class="credit">3D: three.js ／ 素材: Poly Haven (CC0) ／ 地形・水・光・音はすべてコードで生成</div>
  </div>
</div>

<div id="err" class="hidden"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
