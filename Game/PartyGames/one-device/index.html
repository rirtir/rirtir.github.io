<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>1台で遊ぶミニゲーム集</title>
  <link rel="stylesheet" href="shared/app.css">
</head>
<body>
<main class="landing">
  <a class="back-link" href="../">← オンライン版との選択へ</a>
  <p class="eyebrow">PASS &amp; PLAY · SERVERLESS</p>
  <h1>このスマホ<span>1台</span>で<br>16ゲーム。</h1>
  <p class="lead">名前を入れて、必要なときだけ隣の人へスマホを渡します。登録も通信も不要です。</p>
  <section class="game-grid" id="gameGrid"></section>
  <p class="footnote">お題は端末内で読み込みます。ゲーム中の回答は外部へ送信されません。</p>
</main>
<script>
const games = [
  ["ito","🧵","ito","2〜12人","感覚で小さい順に並べる"],
  ["bob-jiten","🗣️","ボブジテン","2〜12人","カタカナなしで説明"],
  ["word-wolf","🐺","ワードウルフ","3〜12人","少数派のお題を会話で探す"],
  ["ng-word","🚫","NGワード","2〜12人","自分だけ知らない禁止語"],
  ["unanimous","🎯","全員一致","2〜12人","同じ答えを目指す"],
  ["majority-predict","👥","多数派を読め","3〜12人","自分の回答と多数派を予想"],
  ["minority-survival","🦊","少数派サバイバル","3〜12人","少ない方へ潜り込む"],
  ["pair-sync","🤝","ペアシンクロ","3〜12人","組になって答えを合わせる"],
  ["telepathy-word","🧠","テレパシーワード","2〜12人","同じ言葉を書いた人数が得点"],
  ["five-seconds-three","⏱️","5秒で3つ","2〜12人","5秒以内に3つ答える"],
  ["taboo-talk","🤐","タブー説明","2〜12人","禁止語を避けて説明"],
  ["closest-estimate","📏","ぴったり予想","2〜12人","正解の数値へ一番近づく"],
  ["secret-thermometer","🌡️","ひみつの温度計","3〜12人","秘密の位置を例えで伝える"],
  ["bluff-definition","📚","ウソ定義選手権","3〜12人","もっともらしい偽定義を作る"],
  ["coop-count","🔢","協力カウント","2〜12人","順番を決めず声をつなぐ"],
  ["answer-first-ogiri","🤣","答えが先大喜利","3〜12人","決まった答えに質問を作る"]
];
document.getElementById("gameGrid").innerHTML = games.map(([slug,icon,name,people,desc]) => `
  <a class="game-link" href="games/${slug}/">
    <span class="game-icon">${icon}</span><span><strong>${name}</strong><small>${people} · ${desc}</small></span><b>›</b>
  </a>`).join("");
</script>
</body>
</html>
