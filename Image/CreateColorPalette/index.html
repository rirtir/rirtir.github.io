<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カラーパレット抽出</title>
<link rel="stylesheet" href="../../css/common-style.css">
<link rel="stylesheet" href="../../css/common-style2.css">
<style>
.wrap{width:100%;max-width:620px;min-width:0}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}
.count{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#colorCount{width:100%;max-width:240px}
#countNumber{width:65px;padding:7px}
.step{padding:6px 12px;flex:0 0 auto}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.color{width:85px;flex:0 0 85px;min-height:70px;border:1px solid #888;border-radius:6px;padding:6px;font-size:12px;display:flex;align-items:flex-end;justify-content:center}
#dropArea{box-sizing:border-box}
.previews{display:flex;flex-wrap:wrap;gap:12px}
figure{flex:1;min-width:140px;margin:0}
canvas{width:100%;height:auto;background-color:#eee;background-image:conic-gradient(#ccc 25%,#eee 0 50%,#ccc 0 75%,#eee 0);background-size:16px 16px}
#status{min-height:1.5em;overflow-wrap:anywhere}
.hint{font-size:13px;color:#555}
button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<main class="wrap">
<h1>カラーパレット抽出</h1>
<div id="dropArea" role="button" tabindex="0">画像をドラッグ＆ドロップ またはクリック</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="controls">
<div class="count"><label for="countNumber">色数</label><button class="step" id="decrease" aria-label="色数を1減らす">−</button><input type="number" id="countNumber" min="2" max="256" value="8"><button class="step" id="increase" aria-label="色数を1増やす">＋</button><input type="range" id="colorCount" min="2" max="256" value="8" aria-label="色数"></div>
<select id="method" aria-label="抽出方法"><option value="rgb">RGB頻度</option><option value="median">MedianCut</option><option value="kmeans">K-means</option></select>
<button id="download" disabled>PNGダウンロード</button>
</div>
<p id="status" role="status" aria-live="polite">画像を追加すると自動で抽出します。</p>
<p class="hint">色を押すとHEXをコピー。抽出は縮小画像を使用し、PNGは元の解像度と透明度で保存します。元の色が少ない場合は実際の色数を表示します。</p>
<div class="previews"><figure><figcaption>元画像</figcaption><canvas id="canvas"></canvas></figure><figure><figcaption>減色プレビュー</figcaption><canvas id="preview"></canvas></figure></div>
<div class="palette" id="palette" aria-label="抽出した色"></div>
</main>
<script src="./app.js" defer></script>
</body>
</html>
