<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>画像→動画生成ツール</title>

<link rel="stylesheet" href="./../../css/common-style.css">
<link rel="stylesheet" href="./../../css/common-style2.css">
<style>

#imageList{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:15px;
}

.imageItem{
width:100px;
border:1px solid #ccc;
background:white;
padding:5px;
cursor:grab;
}

.imageItem img{
width:100%;
height:80px;
object-fit:cover;
}

select{
padding:10px;
font-size:14px;
}

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:none;
align-items:center;
justify-content:center;
z-index:10;
}

#popupContent{
background:white;
padding:20px;
border-radius:10px;
}

</style>

</head>
<body>

<h1>画像→動画生成ツール</h1>

<div id="dropArea">
画像をドラッグ&ドロップ<br>
またはクリックして選択
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>

<div class="controls">
<select id="sortMode">
<option value="name">名前順</option>
<option value="time">作成順</option>
</select>

<label>FPS:
<input type="range" id="fps" min="1" max="60" value="12">
<span id="fpsVal">12</span>
</label>

<button id="generateBtn" disabled>動画生成</button>
<button id="downloadBtn" style="display:none">ダウンロード</button>
</div>

<p id="status" role="status" aria-live="polite"></p>
<div id="imageList"></div>

<div id="popup">
<div id="popupContent">処理中...</div>
</div>

<script type="module" src="./app.js"></script>


</body>
</html>
