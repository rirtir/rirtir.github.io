<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — レイヤー画像エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0F;
    --stage:#101216;
    --panel:#15171D;
    --panel-2:#1C1F27;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --ink:#ECEEF2;
    --ink-dim:#9AA0AC;
    --ink-faint:#5E6573;
    --c-tone:#E8A23C;
    --c-color:#46C4B0;
    --c-focus:#5B8DEF;
    --c-stylize:#B07CE8;
    --c-res:#FF7A9C;
    --ring:#7FB0FF;
    --rail-w:360px;
    --radius:13px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:"Space Mono",monospace}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:0 18px;height:60px;flex:0 0 auto;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{display:block}
  .brand .name{font-weight:700;font-size:18px;letter-spacing:.14em}
  .brand .sub{color:var(--ink-faint);font-size:11px;letter-spacing:.05em;border-left:1px solid var(--line-strong);padding-left:11px}
  .spacer{flex:1}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    height:36px;padding:0 14px;border-radius:9px;
    font-weight:500;font-size:13px;
    border:1px solid var(--line-strong);
    background:rgba(255,255,255,.03);
    color:var(--ink);
    transition:background .15s,border-color .15s,transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:15px;height:15px;opacity:.85}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-dim)}
  .btn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .btn.primary{background:var(--ink);color:#101216;border-color:var(--ink);font-weight:600}
  .btn.primary:hover{background:#fff;border-color:#fff}
  .btn[disabled]{opacity:.38;pointer-events:none}

  /* ---------- workspace ---------- */
  .work{display:flex;flex:1;min-height:0}

  .stage{
    flex:1;min-width:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
    background:
      radial-gradient(120% 120% at 50% 0%,rgba(255,255,255,.025),transparent 60%),
      var(--stage);
    overflow:hidden;
  }
  .canvas-wrap{
    position:relative;max-width:100%;max-height:100%;
    border-radius:8px;
    background-image:
      linear-gradient(45deg,#1a1d24 25%,transparent 25%),
      linear-gradient(-45deg,#1a1d24 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1d24 75%),
      linear-gradient(-45deg,transparent 75%,#1a1d24 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
    background-color:#131620;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.7),0 0 0 1px var(--line);
    will-change:transform;
    cursor:grab;
    touch-action:none;
  }
  .canvas-wrap.panning{cursor:grabbing}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px);border-radius:8px}
  .stage-ui{position:absolute;inset:0;pointer-events:none}
  .stage-tag{
    position:absolute;top:12px;left:14px;
    font-family:"Space Mono",monospace;font-size:11px;
    color:var(--ink-dim);letter-spacing:.04em;
    background:rgba(11,12,15,.6);backdrop-filter:blur(6px);
    padding:4px 9px;border-radius:7px;border:1px solid var(--line);
    pointer-events:none;
  }
  .zoom-tag{
    position:absolute;bottom:14px;right:14px;pointer-events:auto;
    font-size:11px;color:var(--ink-dim);letter-spacing:.04em;
    background:rgba(11,12,15,.6);backdrop-filter:blur(6px);
    padding:4px 10px;border-radius:7px;border:1px solid var(--line);
    transition:color .13s,border-color .13s;
  }
  .zoom-tag:hover{color:var(--ink);border-color:var(--line-strong)}
  .compare-flag{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%) translateY(8px);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    background:var(--ring);color:#06101f;font-weight:600;font-size:12px;
    letter-spacing:.06em;padding:5px 14px;border-radius:20px;
  }
  .compare-flag.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* empty state */
  .empty{
    text-align:center;max-width:340px;
    border:1.5px dashed var(--line-strong);border-radius:18px;
    padding:46px 34px;transition:border-color .2s,background .2s;
  }
  .empty.drag{border-color:var(--ring);background:rgba(127,176,255,.06)}
  .empty .prism-mark{margin:0 auto 20px}
  .empty h2{font-size:19px;font-weight:600;margin-bottom:8px}
  .empty p{color:var(--ink-dim);font-size:13px;margin-bottom:22px}
  .empty .actions{display:flex;gap:10px;justify-content:center}

  /* ---------- rail ---------- */
  .rail{
    flex:0 0 var(--rail-w);width:var(--rail-w);
    border-left:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .rail-section{padding:16px 16px 6px}
  .rail-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .rail-head h3{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
  .stack-count{font-family:"Space Mono",monospace;font-size:11px;color:var(--ink-faint)}

  .add-grid{display:flex;flex-direction:column;gap:12px}
  .add-cat .cat-label{
    display:flex;align-items:center;gap:7px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:7px;
  }
  .cat-dot{width:7px;height:7px;border-radius:2px}
  .add-cat .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    height:30px;padding:0 11px;border-radius:8px;
    font-size:12.5px;font-weight:500;color:var(--ink-dim);
    border:1px solid var(--line);background:rgba(255,255,255,.02);
    transition:.13s;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--ink);border-color:var(--cat,var(--line-strong));background:rgba(255,255,255,.05)}
  .chip::before{content:"+";color:var(--cat);font-weight:700;font-family:"Space Mono",monospace}

  .divider{height:1px;background:var(--line);margin:14px 0 0}

  /* stack list */
  .stack-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 90px}
  .stack-scroll::-webkit-scrollbar{width:10px}
  .stack-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:3px solid var(--panel)}
  .stack-hint{color:var(--ink-faint);font-size:12px;text-align:center;padding:30px 10px;line-height:1.7}
  .stack-hint b{color:var(--ink-dim);font-weight:500}

  .layer{
    position:relative;background:var(--panel-2);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px 13px 14px;margin-bottom:10px;
    border-left:3px solid var(--cat);
    transition:box-shadow .15s,opacity .15s,transform .12s;
  }
  .layer.dragging{opacity:.45;box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
  .layer.disabled .layer-body{opacity:.4;filter:saturate(.4)}
  .layer-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .handle{
    cursor:grab;color:var(--ink-faint);display:flex;padding:2px;margin-left:-2px;
    touch-action:none;
  }
  .handle:active{cursor:grabbing;color:var(--ink-dim)}
  .layer-name{font-weight:600;font-size:13.5px;flex:1;letter-spacing:.01em}
  .layer-cat{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cat);opacity:.9}
  .icon-btn{
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);transition:.12s;
  }
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,.08)}
  .icon-btn.on{color:var(--cat)}
  .icon-btn svg{width:15px;height:15px}
  .icon-btn.danger:hover{color:#ff7a7a;background:rgba(255,122,122,.12)}

  .layer-body .slider-row{display:flex;align-items:center;gap:12px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
    background:rgba(255,255,255,.12);cursor:pointer;accent-color:var(--cat);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--cat);border:3px solid var(--panel-2);
    box-shadow:0 0 0 1px var(--cat);cursor:grab;margin-top:0;
  }
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--cat);
    border:3px solid var(--panel-2);box-shadow:0 0 0 1px var(--cat);cursor:grab;
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
  .val{
    font-family:"Space Mono",monospace;font-size:12px;color:var(--ink);
    min-width:52px;text-align:right;
  }
  .val.neutral{color:var(--ink-faint)}

  /* super-resolution card */
  .scale-row{display:flex;gap:6px;margin-bottom:11px}
  .scale-btn{
    flex:1;height:28px;border-radius:8px;
    font-family:"Space Mono",monospace;font-size:12px;font-weight:700;
    border:1px solid var(--line);color:var(--ink-dim);
    background:rgba(255,255,255,.02);transition:.13s;
  }
  .scale-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .scale-btn.on{color:#0B0C0F;background:var(--cat);border-color:var(--cat)}
  .mini-label{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap}
  .sr-out{margin-top:9px;font-size:11px;color:var(--ink-dim);letter-spacing:.02em}

  /* toast */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line-strong);
    color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;
    box-shadow:0 16px 40px -12px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:.22s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hidden{display:none!important}

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    .work{flex-direction:column}
    .stage{min-height:46vh;padding:18px}
    canvas{max-height:60vh}
    .rail{flex:1 1 auto;width:100%;border-left:none;border-top:1px solid var(--line)}
    .stack-scroll{padding-bottom:30px;overflow:visible}
    .topbar{gap:10px;padding:0 12px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px}
    .brand .sub{display:none}
    .btn span.lbl{display:none}
    .btn{padding:0 11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 L21 19 H3 Z" stroke="#ECEEF2" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 3 L21 19" stroke="#E8A23C" stroke-width="1.4"/>
        <line x1="17" y1="11" x2="23" y2="9.2" stroke="#46C4B0" stroke-width="1.3"/>
        <line x1="17.6" y1="13" x2="23.6" y2="13" stroke="#5B8DEF" stroke-width="1.3"/>
        <line x1="17" y1="15" x2="23" y2="16.8" stroke="#B07CE8" stroke-width="1.3"/>
      </svg>
      <span class="name">PRISM</span>
      <span class="sub">レイヤー画像エディタ</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span class="lbl">画像を開く</span>
    </button>
    <button class="btn" id="btnCompare" disabled
      title="押している間だけ元画像を表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 12 19 8M12 12 19 16" opacity=".5"/></svg>
      <span class="lbl">比較</span>
    </button>
    <button class="btn ghost" id="btnClear" disabled>
      <span class="lbl">すべて削除</span>
    </button>
    <button class="btn primary" id="btnSave" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20h14a2 2 0 0 0 2-2V8l-5-5H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M8 20v-7h8v7M8 3v4h6"/></svg>
      <span class="lbl">書き出す</span>
    </button>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </header>

  <!-- workspace -->
  <div class="work">

    <!-- stage -->
    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <svg class="prism-mark" width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 L21 19 H3 Z" stroke="#5E6573" stroke-width="1.2" stroke-linejoin="round"/>
          <line x1="17" y1="11" x2="23" y2="9" stroke="#E8A23C" stroke-width="1.2"/>
          <line x1="17.6" y1="13" x2="23.8" y2="13" stroke="#46C4B0" stroke-width="1.2"/>
          <line x1="17" y1="15" x2="23" y2="17" stroke="#B07CE8" stroke-width="1.2"/>
        </svg>
        <h2>画像を読み込んで始めましょう</h2>
        <p>ここに画像をドラッグ＆ドロップするか、ファイルを開いてください。JPG・PNG・WebP に対応しています。</p>
        <div class="actions">
          <button class="btn primary" id="emptyOpen">画像を開く</button>
          <button class="btn" id="emptySample">サンプルを使う</button>
        </div>
      </div>

      <div class="canvas-wrap hidden" id="canvasWrap">
        <canvas id="canvas"></canvas>
      </div>
      <div class="stage-ui hidden" id="stageUI">
        <span class="stage-tag mono" id="stageTag"></span>
        <button class="zoom-tag mono" id="zoomTag" title="クリックで 100% 表示に戻す">100%</button>
        <span class="compare-flag" id="compareFlag">元画像</span>
      </div>
    </main>

    <!-- rail -->
    <aside class="rail">
      <div class="rail-section">
        <div class="rail-head"><h3>レイヤーを追加</h3></div>
        <div class="add-grid" id="addGrid"></div>
        <div class="divider"></div>
      </div>

      <div class="rail-section" style="padding-bottom:0">
        <div class="rail-head">
          <h3>フィルタースタック</h3>
          <span class="stack-count mono" id="stackCount">0 layers</span>
        </div>
      </div>
      <div class="stack-scroll" id="stackList"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 超解像のディテール復元に使う畳み込みフィルタ(kernelMatrixはJSから更新) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="srSharpenF" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feConvolveMatrix id="srKernel" order="3" preserveAlpha="true" edgeMode="duplicate"
      kernelMatrix="0 0 0 0 1 0 0 0 0"/>
  </filter>
</svg>

<script>
"use strict";

/* ---------- filter definitions ---------- */
const CATS = {
  tone:    { label:"露出・トーン", color:"var(--c-tone)" },
  color:   { label:"色",          color:"var(--c-color)" },
  focus:   { label:"ぼかし・シャープ", color:"var(--c-focus)" },
  res:     { label:"解像度",      color:"var(--c-res)" },
  stylize: { label:"スタイライズ", color:"var(--c-stylize)" },
};

// css(v) builds the CSS filter function; fmt(v) formats the readout; neutral = value with no visible effect
// special:true のフィルタは CSS filter ではなく専用パイプラインで処理する
const FILTERS = {
  brightness:{ name:"明るさ",    cat:"tone",    min:0,  max:200, step:1,   def:100, neutral:100, fmt:v=>v+"%",  css:v=>`brightness(${v/100})` },
  contrast:  { name:"コントラスト", cat:"tone",  min:0,  max:200, step:1,   def:100, neutral:100, fmt:v=>v+"%",  css:v=>`contrast(${v/100})` },
  opacity:   { name:"不透明度",   cat:"tone",    min:0,  max:100, step:1,   def:100, neutral:100, fmt:v=>v+"%",  css:v=>`opacity(${v/100})` },
  saturate:  { name:"彩度",       cat:"color",   min:0,  max:300, step:1,   def:100, neutral:100, fmt:v=>v+"%",  css:v=>`saturate(${v/100})` },
  hue:       { name:"色相",       cat:"color",   min:-180,max:180,step:1,   def:0,   neutral:0,   fmt:v=>(v>0?"+":"")+v+"°", css:v=>`hue-rotate(${v}deg)` },
  sepia:     { name:"セピア",     cat:"color",   min:0,  max:100, step:1,   def:80,  neutral:0,   fmt:v=>v+"%",  css:v=>`sepia(${v/100})` },
  grayscale: { name:"モノクロ",   cat:"color",   min:0,  max:100, step:1,   def:100, neutral:0,   fmt:v=>v+"%",  css:v=>`grayscale(${v/100})` },
  blur:      { name:"ぼかし",     cat:"focus",   min:0,  max:40,  step:0.5, def:6,   neutral:0,   fmt:v=>v+"px", css:v=>`blur(${v}px)` },
  superres:  { name:"超解像",     cat:"res",     min:0,  max:100, step:1,   def:55,  neutral:0,   fmt:v=>v+"%",
               special:true, scales:[1.5,2,3,4], defScale:2 },
  invert:    { name:"色反転",     cat:"stylize", min:0,  max:100, step:1,   def:100, neutral:0,   fmt:v=>v+"%",  css:v=>`invert(${v/100})` },
};

/* ---------- state ---------- */
let layers = [];            // {id, type, value, enabled, scale?}
let nextId = 1;
let sourceReady = false;
let imgGen = 0;             // 画像の世代(超解像キャッシュの無効化に使用)
const img = new Image();
const MAX_SIDE = 2000;      // 作業バッファの最大辺(処理速度のため)
const MAX_OUT  = 6000;      // 超解像出力の最大辺(メモリ保護のため)

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");
const stage = $("stage");
const empty = $("empty");
const canvasWrap = $("canvasWrap");
const stackList = $("stackList");
const stackCount = $("stackCount");
const stageTag = $("stageTag");
const stageUI = $("stageUI");
const zoomTag = $("zoomTag");
const compareFlag = $("compareFlag");
const fileInput = $("fileInput");

/* ---------- add-layer UI ---------- */
function buildAddGrid(){
  const grid = $("addGrid");
  Object.entries(CATS).forEach(([catKey, cat])=>{
    const wrap = document.createElement("div");
    wrap.className = "add-cat";
    wrap.innerHTML = `<div class="cat-label"><span class="cat-dot" style="background:${cat.color}"></span>${cat.label}</div>`;
    const chips = document.createElement("div");
    chips.className = "chips";
    Object.entries(FILTERS).filter(([,f])=>f.cat===catKey).forEach(([type,f])=>{
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.style.setProperty("--cat", cat.color);
      chip.textContent = f.name;
      chip.addEventListener("click", ()=>addLayer(type));
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    grid.appendChild(wrap);
  });
}

/* ---------- layer ops ---------- */
function addLayer(type){
  const f = FILTERS[type];
  if(f.special && layers.some(l=>l.type===type)){
    toast("超解像レイヤーは 1 つだけ追加できます");
    return;
  }
  const layer = { id:nextId++, type, value:f.def, enabled:true };
  if(f.special) layer.scale = f.defScale;
  layers.push(layer);
  renderStack();
  scheduleRender();
  // 追加したカードまでスクロール
  requestAnimationFrame(()=>{ stackList.scrollTop = stackList.scrollHeight; });
  if(!sourceReady) toast("画像を開くと結果が表示されます");
}

function removeLayer(id){
  layers = layers.filter(l=>l.id!==id);
  renderStack(); scheduleRender();
}
function toggleLayer(id){
  const l = layers.find(l=>l.id===id);
  if(l){ l.enabled = !l.enabled; renderStack(); scheduleRender(); }
}
function clearAll(){
  if(!layers.length) return;
  layers = []; renderStack(); scheduleRender();
}

/* ---------- render the stack list ---------- */
function renderStack(){
  stackCount.textContent = layers.length + (layers.length===1?" layer":" layers");
  $("btnClear").disabled = !layers.length;

  if(!layers.length){
    stackList.innerHTML = `<div class="stack-hint">スタックは空です。<br><b>上のボタンからフィルターを追加</b>すると、<br>上から順に重ねて適用されます。</div>`;
    return;
  }

  stackList.innerHTML = "";
  layers.forEach(layer=>{
    const f = FILTERS[layer.type];
    const cat = CATS[f.cat];
    const card = document.createElement("div");
    card.className = "layer" + (layer.enabled? "" : " disabled");
    card.style.setProperty("--cat", cat.color);
    card.dataset.id = layer.id;

    const isNeutral = Number(layer.value)===f.neutral;
    const topHTML = `
      <div class="layer-top">
        <span class="handle" title="ドラッグで並べ替え" aria-label="並べ替え">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </span>
        <span class="layer-name">${f.name}</span>
        <span class="layer-cat">${f.cat}</span>
        <button class="icon-btn vis ${layer.enabled?'on':''}" title="${layer.enabled?'非表示にする':'表示する'}" aria-label="表示切替">
          ${layer.enabled
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4-.8M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>`}
        </button>
        <button class="icon-btn danger del" title="削除" aria-label="削除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"/></svg>
        </button>
      </div>`;

    if(f.special){
      // 超解像カード: 倍率の切り替え + ディテール復元 + 出力解像度の表示
      const t = sourceReady ? srTarget(layer) : null;
      card.innerHTML = topHTML + `
      <div class="layer-body">
        <div class="scale-row" role="group" aria-label="拡大率">
          ${f.scales.map(s=>`<button class="scale-btn ${layer.scale===s?'on':''}" data-s="${s}">×${s}</button>`).join("")}
        </div>
        <div class="slider-row">
          <span class="mini-label">ディテール</span>
          <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${layer.value}" aria-label="ディテール復元">
          <span class="val ${isNeutral?'neutral':''}">${f.fmt(layer.value)}</span>
        </div>
        <div class="sr-out mono">${t
          ? `出力解像度: ${t.w} × ${t.h} px${t.clamped ? "(上限 "+MAX_OUT+"px に調整)" : ""}`
          : "画像を開くと出力解像度が表示されます"}</div>
      </div>`;
      card.querySelectorAll(".scale-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          layer.scale = Number(btn.dataset.s);
          renderStack();          // ボタン状態と出力解像度の表示を更新
          scheduleRender();
        });
      });
    } else {
      card.innerHTML = topHTML + `
      <div class="layer-body">
        <div class="slider-row">
          <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${layer.value}" aria-label="${f.name}">
          <span class="val ${isNeutral?'neutral':''}">${f.fmt(layer.value)}</span>
        </div>
      </div>`;
    }

    // controls
    const range = card.querySelector("input[type=range]");
    const val = card.querySelector(".val");
    range.addEventListener("input", ()=>{
      layer.value = Number(range.value);
      val.textContent = f.fmt(layer.value);
      val.classList.toggle("neutral", layer.value===f.neutral);
      scheduleRender();
    });
    card.querySelector(".vis").addEventListener("click", ()=>toggleLayer(layer.id));
    card.querySelector(".del").addEventListener("click", ()=>removeLayer(layer.id));

    enableDrag(card, card.querySelector(".handle"));
    stackList.appendChild(card);
  });
}

/* ---------- drag to reorder ---------- */
let dragId = null;
function enableDrag(card, handle){
  handle.addEventListener("pointerdown", ()=>{ card.setAttribute("draggable","true"); });
  ["pointerup","pointercancel"].forEach(ev=>
    handle.addEventListener(ev, ()=>card.removeAttribute("draggable")));

  card.addEventListener("dragstart", e=>{
    dragId = Number(card.dataset.id);
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
  });
  card.addEventListener("dragend", ()=>{
    card.classList.remove("dragging");
    card.removeAttribute("draggable");
    commitOrderFromDOM();
    dragId = null;
  });
}
stackList.addEventListener("dragover", e=>{
  e.preventDefault();
  const dragging = stackList.querySelector(".dragging");
  if(!dragging) return;
  const after = getDragAfter(stackList, e.clientY);
  if(after == null) stackList.appendChild(dragging);
  else stackList.insertBefore(dragging, after);
});
function getDragAfter(container, y){
  const cards = [...container.querySelectorAll(".layer:not(.dragging)")];
  return cards.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset)
      return { offset, element:child };
    return closest;
  }, { offset:-Infinity, element:null }).element;
}
function commitOrderFromDOM(){
  const order = [...stackList.querySelectorAll(".layer")].map(c=>Number(c.dataset.id));
  layers.sort((a,b)=> order.indexOf(a.id) - order.indexOf(b.id));
  scheduleRender();
}

/* ---------- image processing ---------- */
function buildFilterString(){
  const parts = layers
    .filter(l=>l.enabled && !FILTERS[l.type].special)
    .map(l=>FILTERS[l.type].css(l.value));
  return parts.length ? parts.join(" ") : "none";
}

/* ---------- super resolution ----------
   1) 元画像を 2 倍ずつ段階的に拡大(高品質補間でジャギーを抑える)
   2) SVG の畳み込みフィルタでアンシャープ系のディテール復元をかける
   拡大結果(upCanvas)とシャープ結果(srCanvas)を別々にキャッシュし、
   ディテールのスライダー操作では拡大をやり直さない */
const upCanvas = document.createElement("canvas");
const srCanvas = document.createElement("canvas");
let upKey = "", srKey = "", srClampNoticed = "";

function activeSR(){
  return layers.find(l=>l.type==="superres" && l.enabled);
}

// 倍率から出力サイズを計算(MAX_OUT を超える場合は倍率を自動調整)
function srTarget(sr){
  const nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
  const longest = Math.max(nw, nh) || 1;
  let s = sr.scale, clamped = false;
  if(longest * s > MAX_OUT){
    s = Math.max(1, MAX_OUT / longest);
    clamped = true;
  }
  return { w: Math.max(1, Math.round(nw*s)), h: Math.max(1, Math.round(nh*s)), s, clamped };
}

function ensureSR(sr){
  const t = srTarget(sr);
  const uKey = `${imgGen}|${t.w}x${t.h}`;

  if(uKey !== upKey){
    // 段階的アップスケール
    let cur = img, cw = img.naturalWidth, ch = img.naturalHeight;
    while(cw * 2 <= t.w){
      const step = document.createElement("canvas");
      step.width = cw*2; step.height = ch*2;
      const sc = step.getContext("2d");
      sc.imageSmoothingEnabled = true;
      sc.imageSmoothingQuality = "high";
      sc.drawImage(cur, 0, 0, step.width, step.height);
      cur = step; cw = step.width; ch = step.height;
    }
    upCanvas.width = t.w; upCanvas.height = t.h;
    const uc = upCanvas.getContext("2d");
    uc.imageSmoothingEnabled = true;
    uc.imageSmoothingQuality = "high";
    uc.drawImage(cur, 0, 0, t.w, t.h);
    upKey = uKey;
    srKey = "";
  }

  const kKey = uKey + "|" + sr.value;
  if(kKey !== srKey){
    srCanvas.width = t.w; srCanvas.height = t.h;
    const sc = srCanvas.getContext("2d");
    const a = (sr.value/100) * 1.1;   // シャープ強度
    if(a > 0.001){
      $("srKernel").setAttribute("kernelMatrix",
        `0 ${-a} 0 ${-a} ${1 + 4*a} ${-a} 0 ${-a} 0`);
      sc.filter = "url(#srSharpenF)";
    } else {
      sc.filter = "none";
    }
    sc.drawImage(upCanvas, 0, 0);
    sc.filter = "none";
    srKey = kKey;
  }

  if(t.clamped && srClampNoticed !== uKey){
    toast(`出力が上限 ${MAX_OUT}px を超えるため、倍率を ×${(Math.round(t.s*100)/100)} に調整しました`);
    srClampNoticed = uKey;
  }
  return t;
}

let pendingRender = false;
function scheduleRender(){
  if(pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(()=>{ pendingRender = false; render(); });
}

function render(showOriginal){
  if(!sourceReady) return;

  const sr = showOriginal ? null : activeSR();
  let source = img, w, h;

  if(sr){
    // 超解像が有効なら、出力解像度はその倍率に追従する
    ensureSR(sr);
    source = srCanvas;
    w = srCanvas.width; h = srCanvas.height;
  } else {
    w = img.naturalWidth; h = img.naturalHeight;
    if(Math.max(w,h) > MAX_SIDE){
      const s = MAX_SIDE/Math.max(w,h);
      w = Math.round(w*s); h = Math.round(h*s);
    }
  }

  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  ctx.clearRect(0,0,w,h);
  ctx.filter = showOriginal ? "none" : buildFilterString();
  ctx.drawImage(source, 0, 0, w, h);
  ctx.filter = "none";

  // 解像度表示(超解像時は 元 → 出力 を併記)
  if(sr && w !== img.naturalWidth){
    const ratio = Math.round((w / img.naturalWidth) * 100) / 100;
    stageTag.textContent = `${img.naturalWidth} × ${img.naturalHeight} → ${w} × ${h} px (×${ratio})`;
  } else {
    stageTag.textContent = `${img.naturalWidth} × ${img.naturalHeight} px`;
  }
}

/* ---------- loading images ---------- */
function loadFromURL(url){
  const tmp = new Image();
  tmp.crossOrigin = "anonymous";
  tmp.onload = ()=>{
    img.src = url;
    img.onload = ()=>{
      sourceReady = true;
      imgGen++;
      upKey = srKey = "";          // 超解像キャッシュを破棄
      empty.classList.add("hidden");
      canvasWrap.classList.remove("hidden");
      stageUI.classList.remove("hidden");
      $("btnSave").disabled = false;
      $("btnCompare").disabled = false;
      resetView();
      renderStack();               // 超解像カードの出力解像度表示を更新
      render();
      if(!zoomHintShown){
        toast("プレビューはホイールで拡大縮小、ドラッグで移動できます");
        zoomHintShown = true;
      }
    };
  };
  tmp.onerror = ()=> toast("画像を読み込めませんでした");
  tmp.src = url;
}
function handleFile(file){
  if(!file){ return; }
  if(!file.type.startsWith("image/")){
    toast("画像ファイルではありません。JPG・PNG・WebP をお試しください");
    return;
  }
  loadFromURL(URL.createObjectURL(file));
}

/* procedural sample so the tool is playable immediately */
function loadSample(){
  const c = document.createElement("canvas");
  c.width = 1200; c.height = 800;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0,0,1200,800);
  g.addColorStop(0,"#2b3a8f"); g.addColorStop(.5,"#9c3d8a"); g.addColorStop(1,"#e6a23c");
  x.fillStyle = g; x.fillRect(0,0,1200,800);
  // soft orbs
  [["#ffd27d",300,260,200],["#5be0c8",880,300,170],["#ff7a9c",640,560,150],["#7fb0ff",980,620,120]]
    .forEach(([col,cx,cy,r])=>{
      const rg = x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,col); rg.addColorStop(1,"rgba(0,0,0,0)");
      x.fillStyle = rg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
    });
  // grid lines for detail (shows sharpen/blur clearly)
  x.strokeStyle = "rgba(255,255,255,.10)"; x.lineWidth = 1;
  for(let i=0;i<=1200;i+=60){ x.beginPath();x.moveTo(i,0);x.lineTo(i,800);x.stroke(); }
  for(let i=0;i<=800;i+=60){ x.beginPath();x.moveTo(0,i);x.lineTo(1200,i);x.stroke(); }
  x.fillStyle = "rgba(255,255,255,.92)";
  x.font = "700 96px 'Space Grotesk', sans-serif";
  x.fillText("PRISM", 80, 460);
  loadFromURL(c.toDataURL("image/png"));
}

/* ---------- export ---------- */
function saveImage(){
  if(!sourceReady) return;
  canvas.toBlob(blob=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prism-export.png";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("PNG として書き出しました");
  }, "image/png");
}

/* ---------- compare (hold) ---------- */
function setCompare(on){
  if(!sourceReady) return;
  compareFlag.classList.toggle("on", on);
  render(on);
}

/* ---------- preview zoom & pan ---------- */
const view = { z:1, tx:0, ty:0 };
let zoomHintShown = false;

function applyView(){
  canvasWrap.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.z})`;
  zoomTag.textContent = Math.round(view.z*100) + "%";
}
function resetView(){
  view.z = 1; view.tx = 0; view.ty = 0;
  applyView();
}

// ホイールでカーソル位置を中心に拡大縮小
stage.addEventListener("wheel", e=>{
  if(!sourceReady) return;
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const cx = e.clientX - rect.left - rect.width/2;   // ステージ中心基準のカーソル位置
  const cy = e.clientY - rect.top  - rect.height/2;
  const nz = Math.min(12, Math.max(0.2, view.z * Math.exp(-e.deltaY * 0.0016)));
  view.tx = cx - (cx - view.tx) * (nz / view.z);
  view.ty = cy - (cy - view.ty) * (nz / view.z);
  view.z = nz;
  applyView();
}, { passive:false });

// ドラッグでパン
let panning = null;
canvasWrap.addEventListener("pointerdown", e=>{
  if(!sourceReady || e.button !== 0) return;
  panning = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty };
  canvasWrap.setPointerCapture(e.pointerId);
  canvasWrap.classList.add("panning");
});
canvasWrap.addEventListener("pointermove", e=>{
  if(!panning) return;
  view.tx = panning.tx + (e.clientX - panning.x);
  view.ty = panning.ty + (e.clientY - panning.y);
  applyView();
});
["pointerup","pointercancel"].forEach(ev=>
  canvasWrap.addEventListener(ev, ()=>{
    panning = null;
    canvasWrap.classList.remove("panning");
  }));
canvasWrap.addEventListener("dblclick", resetView);
zoomTag.addEventListener("click", resetView);

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}

/* ---------- wiring ---------- */
function openPicker(){ fileInput.value=""; fileInput.click(); }
$("btnOpen").addEventListener("click", openPicker);
$("emptyOpen").addEventListener("click", openPicker);
$("emptySample").addEventListener("click", loadSample);
$("btnSave").addEventListener("click", saveImage);
$("btnClear").addEventListener("click", clearAll);
fileInput.addEventListener("change", e=> handleFile(e.target.files[0]));

const cmp = $("btnCompare");
cmp.addEventListener("pointerdown", ()=>setCompare(true));
["pointerup","pointerleave","pointercancel"].forEach(ev=>
  cmp.addEventListener(ev, ()=>setCompare(false)));

// drag & drop onto stage
["dragenter","dragover"].forEach(ev=>
  stage.addEventListener(ev, e=>{ e.preventDefault(); empty.classList.add("drag"); }));
["dragleave","drop"].forEach(ev=>
  stage.addEventListener(ev, e=>{ e.preventDefault(); empty.classList.remove("drag"); }));
stage.addEventListener("drop", e=>{
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file) handleFile(file);
});

// init
buildAddGrid();
renderStack();
</script>
</body>
</html>
