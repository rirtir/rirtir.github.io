<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — レイヤー画像エディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C0F;
    --stage:#101216;
    --panel:#15171D;
    --panel-2:#1C1F27;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --ink:#ECEEF2;
    --ink-dim:#9AA0AC;
    --ink-faint:#5E6573;
    --c-tone:#E8A23C;
    --c-color:#46C4B0;
    --c-focus:#5B8DEF;
    --c-stylize:#B07CE8;
    --c-res:#FF7A9C;
    --ring:#7FB0FF;
    --rail-w:360px;
    --radius:13px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .mono{font-family:"Space Mono",monospace}
  button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:0 18px;height:60px;flex:0 0 auto;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{display:block}
  .brand .name{font-weight:700;font-size:18px;letter-spacing:.14em}
  .brand .sub{color:var(--ink-faint);font-size:11px;letter-spacing:.05em;border-left:1px solid var(--line-strong);padding-left:11px}
  .spacer{flex:1}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    height:36px;padding:0 14px;border-radius:9px;
    font-weight:500;font-size:13px;
    border:1px solid var(--line-strong);
    background:rgba(255,255,255,.03);
    color:var(--ink);
    transition:background .15s,border-color .15s,transform .05s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
  .btn:active{transform:translateY(1px)}
  .btn svg{width:15px;height:15px;opacity:.85}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink-dim)}
  .btn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .btn.primary{background:var(--ink);color:#101216;border-color:var(--ink);font-weight:600}
  .btn.primary:hover{background:#fff;border-color:#fff}
  .btn[disabled]{opacity:.38;pointer-events:none}

  /* ---------- workspace ---------- */
  .work{display:flex;flex:1;min-height:0}

  .stage{
    flex:1;min-width:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
    background:
      radial-gradient(120% 120% at 50% 0%,rgba(255,255,255,.025),transparent 60%),
      var(--stage);
    overflow:hidden;
  }
  .canvas-wrap{
    position:relative;max-width:100%;max-height:100%;
    border-radius:8px;
    background-image:
      linear-gradient(45deg,#1a1d24 25%,transparent 25%),
      linear-gradient(-45deg,#1a1d24 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1d24 75%),
      linear-gradient(-45deg,transparent 75%,#1a1d24 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
    background-color:#131620;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.7),0 0 0 1px var(--line);
    will-change:transform;
    cursor:grab;
    touch-action:none;
  }
  .canvas-wrap.panning{cursor:grabbing}
  canvas{display:block;max-width:100%;max-height:calc(100vh - 116px);max-height:calc(100dvh - 116px);border-radius:8px}
  .stage-ui{position:absolute;inset:0;pointer-events:none}
  .stage-tag{
    position:absolute;top:12px;left:14px;
    font-family:"Space Mono",monospace;font-size:11px;
    color:var(--ink-dim);letter-spacing:.04em;
    background:rgba(11,12,15,.6);backdrop-filter:blur(6px);
    padding:4px 9px;border-radius:7px;border:1px solid var(--line);
    pointer-events:none;
  }
  .zoom-tag{
    position:absolute;bottom:14px;right:14px;pointer-events:auto;
    font-size:11px;color:var(--ink-dim);letter-spacing:.04em;
    background:rgba(11,12,15,.6);backdrop-filter:blur(6px);
    padding:4px 10px;border-radius:7px;border:1px solid var(--line);
    transition:color .13s,border-color .13s;
  }
  .zoom-tag:hover{color:var(--ink);border-color:var(--line-strong)}
  .compare-flag{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%) translateY(8px);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    background:var(--ring);color:#06101f;font-weight:600;font-size:12px;
    letter-spacing:.06em;padding:5px 14px;border-radius:20px;
  }
  .compare-flag.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* empty state */
  .empty{
    text-align:center;max-width:340px;
    border:1.5px dashed var(--line-strong);border-radius:18px;
    padding:46px 34px;transition:border-color .2s,background .2s;
  }
  .empty.drag{border-color:var(--ring);background:rgba(127,176,255,.06)}
  .empty .prism-mark{margin:0 auto 20px}
  .empty h2{font-size:19px;font-weight:600;margin-bottom:8px}
  .empty p{color:var(--ink-dim);font-size:13px;margin-bottom:22px}
  .empty .actions{display:flex;gap:10px;justify-content:center}

  /* ---------- rail ---------- */
  .rail{
    flex:0 0 var(--rail-w);width:var(--rail-w);
    border-left:1px solid var(--line);
    background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  .rail-section{padding:16px 16px 6px}
  .rail-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .rail-head h3{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
  .stack-count{font-family:"Space Mono",monospace;font-size:11px;color:var(--ink-faint)}

  .add-grid{display:flex;flex-direction:column;gap:12px}
  .add-cat .cat-label{
    display:flex;align-items:center;gap:7px;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:7px;
  }
  .cat-dot{width:7px;height:7px;border-radius:2px}
  .add-cat .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    height:30px;padding:0 11px;border-radius:8px;
    font-size:12.5px;font-weight:500;color:var(--ink-dim);
    border:1px solid var(--line);background:rgba(255,255,255,.02);
    transition:.13s;display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--ink);border-color:var(--cat,var(--line-strong));background:rgba(255,255,255,.05)}
  .chip::before{content:"+";color:var(--cat);font-weight:700;font-family:"Space Mono",monospace}

  .divider{height:1px;background:var(--line);margin:14px 0 0}

  /* stack list */
  .stack-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 90px}
  .stack-scroll::-webkit-scrollbar{width:10px}
  .stack-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px;border:3px solid var(--panel)}
  .stack-hint{color:var(--ink-faint);font-size:12px;text-align:center;padding:30px 10px;line-height:1.7}
  .stack-hint b{color:var(--ink-dim);font-weight:500}

  .layer{
    position:relative;background:var(--panel-2);
    border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 12px 13px 14px;margin-bottom:10px;
    border-left:3px solid var(--cat);
    transition:box-shadow .15s,opacity .15s,transform .12s;
  }
  .layer.dragging{opacity:.45;box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
  .layer.disabled .layer-body{opacity:.4;filter:saturate(.4)}
  .layer-top{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .handle{
    cursor:grab;color:var(--ink-faint);display:flex;padding:2px;margin-left:-2px;
    touch-action:none;
  }
  .handle:active{cursor:grabbing;color:var(--ink-dim)}
  .layer-name{font-weight:600;font-size:13.5px;flex:1;letter-spacing:.01em}
  .layer-cat{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cat);opacity:.9}
  .icon-btn{
    width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);transition:.12s;
  }
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,.08)}
  .icon-btn.on{color:var(--cat)}
  .icon-btn svg{width:15px;height:15px}
  .icon-btn.danger:hover{color:#ff7a7a;background:rgba(255,122,122,.12)}

  .layer-body .slider-row{display:flex;align-items:center;gap:12px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;
    background:rgba(255,255,255,.12);cursor:pointer;accent-color:var(--cat);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--cat);border:3px solid var(--panel-2);
    box-shadow:0 0 0 1px var(--cat);cursor:grab;margin-top:0;
  }
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--cat);
    border:3px solid var(--panel-2);box-shadow:0 0 0 1px var(--cat);cursor:grab;
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
  .val{
    font-family:"Space Mono",monospace;font-size:12px;color:var(--ink);
    min-width:52px;text-align:right;
  }
  .val.neutral{color:var(--ink-faint)}

  /* super-resolution card */
  .scale-row{display:flex;gap:6px;margin-bottom:11px}
  .scale-btn{
    flex:1;height:28px;border-radius:8px;
    font-family:"Space Mono",monospace;font-size:12px;font-weight:700;
    border:1px solid var(--line);color:var(--ink-dim);
    background:rgba(255,255,255,.02);transition:.13s;
  }
  .scale-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .scale-btn.on{color:#0B0C0F;background:var(--cat);border-color:var(--cat)}
  .mini-label{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;white-space:nowrap}
  .sr-out{margin-top:9px;font-size:11px;color:var(--ink-dim);letter-spacing:.02em}

  /* resize / color / advanced controls */
  .resize-size-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 10px}
  .size-box{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
  .size-box span{font-size:10px;color:var(--ink-faint);letter-spacing:.08em;min-width:12px}
  .num-input{
    width:100%;min-width:0;background:transparent;border:none;color:var(--ink);
    font-family:"Space Mono",monospace;font-size:13px;outline:none;text-align:right;
  }
  .num-input::-webkit-inner-spin-button,.num-input::-webkit-outer-spin-button{opacity:.35}
  .quality-row{display:flex;gap:6px;margin-top:8px}
  .quality-btn{
    flex:1;height:28px;border-radius:8px;font-size:12px;font-weight:600;
    border:1px solid var(--line);color:var(--ink-dim);background:rgba(255,255,255,.02);transition:.13s;
  }
  .quality-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .quality-btn.on{color:#0B0C0F;background:var(--cat);border-color:var(--cat)}
  .color-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .color-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
  .color-box span{font-size:10px;color:var(--ink-faint);letter-spacing:.08em;white-space:nowrap}
  .color-input{width:34px;height:24px;border:none;background:transparent;padding:0;cursor:pointer}
  .param-row{display:flex;align-items:center;gap:10px;margin-top:9px}
  .param-row:first-child{margin-top:0}
  .param-row .mini-label{min-width:76px}
  .param-row .val{min-width:46px}
  .mobile-note{margin-top:9px;font-size:10.5px;color:var(--ink-faint);line-height:1.45}

  /* toast */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line-strong);
    color:var(--ink);padding:11px 18px;border-radius:11px;font-size:13px;
    box-shadow:0 16px 40px -12px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:.22s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .hidden{display:none!important}

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh}
    .work{flex-direction:column}
    .stage{min-height:46vh;padding:18px}
    canvas{max-height:60vh}
    .rail{flex:1 1 auto;width:100%;border-left:none;border-top:1px solid var(--line)}
    .stack-scroll{padding-bottom:30px;overflow:visible}
    .topbar{gap:10px;padding:0 12px;flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px}
    .brand .sub{display:none}
    .btn span.lbl{display:none}
    .btn{padding:0 11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3 L21 19 H3 Z" stroke="#ECEEF2" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 3 L21 19" stroke="#E8A23C" stroke-width="1.4"/>
        <line x1="17" y1="11" x2="23" y2="9.2" stroke="#46C4B0" stroke-width="1.3"/>
        <line x1="17.6" y1="13" x2="23.6" y2="13" stroke="#5B8DEF" stroke-width="1.3"/>
        <line x1="17" y1="15" x2="23" y2="16.8" stroke="#B07CE8" stroke-width="1.3"/>
      </svg>
      <span class="name">PRISM</span>
      <span class="sub">レイヤー画像エディタ</span>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btnOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span class="lbl">画像を開く</span>
    </button>
    <button class="btn" id="btnCompare" disabled
      title="押している間だけ元画像を表示">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 12 19 8M12 12 19 16" opacity=".5"/></svg>
      <span class="lbl">比較</span>
    </button>
    <button class="btn ghost" id="btnClear" disabled>
      <span class="lbl">すべて削除</span>
    </button>
    <button class="btn primary" id="btnSave" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20h14a2 2 0 0 0 2-2V8l-5-5H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M8 20v-7h8v7M8 3v4h6"/></svg>
      <span class="lbl">書き出す</span>
    </button>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
  </header>

  <!-- workspace -->
  <div class="work">

    <!-- stage -->
    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <svg class="prism-mark" width="52" height="52" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 L21 19 H3 Z" stroke="#5E6573" stroke-width="1.2" stroke-linejoin="round"/>
          <line x1="17" y1="11" x2="23" y2="9" stroke="#E8A23C" stroke-width="1.2"/>
          <line x1="17.6" y1="13" x2="23.8" y2="13" stroke="#46C4B0" stroke-width="1.2"/>
          <line x1="17" y1="15" x2="23" y2="17" stroke="#B07CE8" stroke-width="1.2"/>
        </svg>
        <h2>画像を読み込んで始めましょう</h2>
        <p>ここに画像をドラッグ＆ドロップするか、ファイルを開いてください。JPG・PNG・WebP に対応しています。</p>
        <div class="actions">
          <button class="btn primary" id="emptyOpen">画像を開く</button>
          <button class="btn" id="emptySample">サンプルを使う</button>
        </div>
      </div>

      <div class="canvas-wrap hidden" id="canvasWrap">
        <canvas id="canvas"></canvas>
      </div>
      <div class="stage-ui hidden" id="stageUI">
        <span class="stage-tag mono" id="stageTag"></span>
        <button class="zoom-tag mono" id="zoomTag" title="クリックで 100% 表示に戻す">100%</button>
        <span class="compare-flag" id="compareFlag">元画像</span>
      </div>
    </main>

    <!-- rail -->
    <aside class="rail">
      <div class="rail-section">
        <div class="rail-head"><h3>レイヤーを追加</h3></div>
        <div class="add-grid" id="addGrid"></div>
        <div class="divider"></div>
      </div>

      <div class="rail-section" style="padding-bottom:0">
        <div class="rail-head">
          <h3>フィルタースタック</h3>
          <span class="stack-count mono" id="stackCount">0 layers</span>
        </div>
      </div>
      <div class="stack-scroll" id="stackList"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 超解像のディテール復元に使う畳み込みフィルタ(kernelMatrixはJSから更新) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="srSharpenF" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feConvolveMatrix id="srKernel" order="3" preserveAlpha="true" edgeMode="duplicate"
      kernelMatrix="0 0 0 0 1 0 0 0 0"/>
  </filter>
</svg>


<script>
"use strict";

/* ---------- runtime guards ---------- */
const IS_COARSE = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
const MAX_SIDE = IS_COARSE ? 1600 : 2000;    // 通常プレビューの最大辺
const MAX_OUT  = IS_COARSE ? 3500 : 6000;    // 解像度系フィルタ後の最大辺
const MAX_PIXELS_NOTICE = IS_COARSE ? 9000000 : 18000000;

window.addEventListener("error", e=>{
  toast("JSエラー: " + (e.message || "不明なエラー"));
});
window.addEventListener("unhandledrejection", e=>{
  const msg = e.reason && (e.reason.message || e.reason.toString()) || "不明なエラー";
  toast("処理エラー: " + msg);
});

/* ---------- filter definitions ---------- */
const CATS = {
  tone:    { label:"露出・トーン", color:"var(--c-tone)" },
  color:   { label:"色",          color:"var(--c-color)" },
  focus:   { label:"ぼかし・シャープ", color:"var(--c-focus)" },
  res:     { label:"解像度",      color:"var(--c-res)" },
  stylize: { label:"スタイライズ", color:"var(--c-stylize)" },
};

const RESIZE_SCALES = [
  { key:"2",      label:"×2",   factor:2 },
  { key:"1",      label:"×1",   factor:1 },
  { key:"0.5",    label:"×1/2", factor:0.5 },
  { key:"0.25",   label:"×1/4", factor:0.25 },
  { key:"0.125",  label:"×1/8", factor:0.125 },
  { key:"custom", label:"カスタム", factor:null },
];
const QUALITY_LABELS = { low:"低", medium:"中", high:"高" };

const FILTERS = {
  brightness:{ name:"明るさ",       cat:"tone",    min:0,  max:200, step:1,   def:100, neutral:100, fmt:v=>v+"%" },
  contrast:  { name:"コントラスト", cat:"tone",    min:0,  max:200, step:1,   def:100, neutral:100, fmt:v=>v+"%" },
  opacity:   { name:"不透明度",     cat:"tone",    min:0,  max:100, step:1,   def:100, neutral:100, fmt:v=>v+"%" },
  bias:      { name:"バイアス消去", cat:"tone",    special:true },
  saturate:  { name:"彩度",         cat:"color",   min:0,  max:300, step:1,   def:100, neutral:100, fmt:v=>v+"%" },
  hue:       { name:"色相",         cat:"color",   min:-180,max:180,step:1,   def:0,   neutral:0,   fmt:v=>(v>0?"+":"")+v+"°" },
  sepia:     { name:"セピア",       cat:"color",   min:0,  max:100, step:1,   def:80,  neutral:0,   fmt:v=>v+"%" },
  grayscale: { name:"グレースケール", cat:"color", min:0,  max:100, step:1,   def:100, neutral:0,   fmt:v=>v+"%" },
  quantize:  { name:"減色",         cat:"color",   min:2,  max:256, step:1,   def:32,  neutral:256, fmt:v=>v+"色", special:true },
  blur:      { name:"ぼかし",       cat:"focus",   min:0,  max:40,  step:0.5, def:6,   neutral:0,   fmt:v=>v+"px" },
  superres:  { name:"超解像",       cat:"res",     min:0,  max:100, step:1,   def:55,  neutral:0,   fmt:v=>v+"%", special:true, scales:[1.5,2,3,4], defScale:2 },
  resize:    { name:"リサイズ",     cat:"res",     special:true },
  invert:    { name:"色反転",       cat:"stylize", min:0,  max:100, step:1,   def:100, neutral:0,   fmt:v=>v+"%" },
};

/* ---------- state ---------- */
let layers = [];
let nextId = 1;
let sourceReady = false;
let imgGen = 0;
const img = new Image();

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently:true });
const stage = $("stage");
const empty = $("empty");
const canvasWrap = $("canvasWrap");

const compareFlag = $("compareFlag");
const fileInput = $("fileInput");

/* ---------- small utilities ---------- */
function clamp(v, min=0, max=255){ return v < min ? min : (v > max ? max : v); }
function clampInt(v, min=1, max=MAX_OUT){
  v = Math.round(Number(v));
  if(!Number.isFinite(v)) return min;
  return Math.max(min, Math.min(max, v));
}
function createCanvas(w,h){
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}
function drawImageToCanvas(src, w, h, quality="high"){
  const c = createCanvas(w,h);
  const x = c.getContext("2d", { willReadFrequently:true });
  x.imageSmoothingEnabled = quality !== "low";
  x.imageSmoothingQuality = quality === "high" ? "high" : "medium";
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function copyCanvas(src){ return drawImageToCanvas(src, src.width, src.height, "high"); }
function hexToRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if(!m) return [0,0,0];
  const n = parseInt(m[1],16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function pixelLimitCanvas(src){
  const longest = Math.max(src.width, src.height);
  if(longest <= MAX_OUT) return src;
  const s = MAX_OUT / longest;
  toast(`出力が上限 ${MAX_OUT}px を超えるため自動調整しました`);
  return drawImageToCanvas(src, Math.round(src.width*s), Math.round(src.height*s), "high");
}
function stagePoint(clientX, clientY){
  const rect = stage.getBoundingClientRect();
  return { x: clientX - rect.left - rect.width/2, y: clientY - rect.top - rect.height/2 };
}
function distance(a,b){ return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
function midpoint(a,b){ return { clientX:(a.clientX+b.clientX)/2, clientY:(a.clientY+b.clientY)/2 }; }

/* ---------- add-layer UI ---------- */
function buildAddGrid(){
  const grid = $("addGrid");
  Object.entries(CATS).forEach(([catKey, cat])=>{
    const wrap = document.createElement("div");
    wrap.className = "add-cat";
    wrap.innerHTML = `<div class="cat-label"><span class="cat-dot" style="background:${cat.color}"></span>${cat.label}</div>`;
    const chips = document.createElement("div");
    chips.className = "chips";
    Object.entries(FILTERS).filter(([,f])=>f.cat===catKey).forEach(([type,f])=>{
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.style.setProperty("--cat", cat.color);
      chip.textContent = f.name;
      chip.addEventListener("click", ()=>addLayer(type));
      chips.appendChild(chip);
    });
    wrap.appendChild(chips);
    grid.appendChild(wrap);
  });
}

function makeLayer(type){
  const f = FILTERS[type];
  const layer = { id:nextId++, type, value:f.def ?? 0, enabled:true };
  if(type === "superres") layer.scale = f.defScale;
  if(type === "resize"){
    layer.mode = "1";
    layer.quality = "medium";
    layer.width = null;
    layer.height = null;
  }
  if(type === "grayscale"){
    layer.lowColor = "#000000";
    layer.highColor = "#ffffff";
  }
  if(type === "bias"){
    layer.value = 85;       // 補正量
    layer.size = 121;       // 局所平均サイズ
    layer.offset = 0;       // 明るさオフセット
    layer.threshold = 3;    // 偏差しきい値
  }
  return layer;
}

/* ---------- layer ops ---------- */
function addLayer(type){
  const f = FILTERS[type];
  if(type === "superres" && layers.some(l=>l.type===type)){
    toast("超解像レイヤーは 1 つだけ追加できます");
    return;
  }
  const layer = makeLayer(type);
  layers.push(layer);
  if(type === "resize" && sourceReady) updateResizeFromMode(layer, "1");
  renderStack();
  scheduleRender();
  requestAnimationFrame(()=>{ stackList.scrollTop = stackList.scrollHeight; });
  if(!sourceReady) toast("画像を開くと結果が表示されます");
}

function removeLayer(id){
  layers = layers.filter(l=>l.id!==id);
  renderStack(); scheduleRender();
}
function toggleLayer(id){
  const l = layers.find(l=>l.id===id);
  if(l){ l.enabled = !l.enabled; renderStack(); scheduleRender(); }
}
function clearAll(){
  if(!layers.length) return;
  layers = []; renderStack(); scheduleRender();
}

/* ---------- dimension helpers ---------- */
function baseDimensions(){
  if(!sourceReady) return { w:0, h:0 };
  let w = img.naturalWidth, h = img.naturalHeight;
  const hasResolutionLayer = layers.some(l=>l.enabled && (l.type === "superres" || l.type === "resize"));
  if(!hasResolutionLayer && Math.max(w,h) > MAX_SIDE){
    const s = MAX_SIDE / Math.max(w,h);
    w = Math.round(w*s); h = Math.round(h*s);
  }
  return { w, h };
}
function layerInputSize(targetLayer){
  let size = baseDimensions();
  for(const l of layers){
    if(l.id === targetLayer.id) break;
    if(!l.enabled) continue;
    if(l.type === "superres"){
      const t = scaleTarget(size.w, size.h, l.scale || 1);
      size = { w:t.w, h:t.h };
    } else if(l.type === "resize"){
      const t = resizeTarget(l, size.w, size.h);
      size = { w:t.w, h:t.h };
    }
  }
  return size;
}
function scaleTarget(w,h,scale){
  const longest = Math.max(w,h) || 1;
  let s = scale, clamped = false;
  if(longest * s > MAX_OUT){
    s = Math.max(1 / longest, MAX_OUT / longest);
    clamped = true;
  }
  return { w:Math.max(1, Math.round(w*s)), h:Math.max(1, Math.round(h*s)), s, clamped };
}
function resizeTarget(layer, inputW, inputH){
  if(layer.mode !== "custom"){
    const def = RESIZE_SCALES.find(x=>x.key === layer.mode) || RESIZE_SCALES[1];
    const t = scaleTarget(inputW, inputH, def.factor || 1);
    return { w:t.w, h:t.h, clamped:t.clamped };
  }
  const w = clampInt(layer.width || inputW, 1, MAX_OUT);
  const h = clampInt(layer.height || inputH, 1, MAX_OUT);
  return { w, h, clamped:false };
}
function updateResizeFromMode(layer, mode){
  layer.mode = mode;
  const input = layerInputSize(layer);
  if(mode !== "custom"){
    const t = resizeTarget(layer, input.w, input.h);
    layer.width = t.w;
    layer.height = t.h;
  } else {
    if(!layer.width || !layer.height){
      layer.width = input.w;
      layer.height = input.h;
    }
  }
}
function refreshResizeLayers(){
  for(const l of layers){
    if(l.type === "resize" && l.enabled && l.mode !== "custom") updateResizeFromMode(l, l.mode);
  }
}

/* ---------- render the stack list ---------- */
function renderStack(){

        </span>

          ${layer.enabled
            ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`
            : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4-.8M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>`}
        </button>
        <button class="icon-btn danger del" title="削除" aria-label="削除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"/></svg>

function sliderHTML(f, value, label=null, className="main-range"){
  const isNeutral = Number(value) === f.neutral;
  return `<div class="slider-row">
    ${label ? `<span class="mini-label">${label}</span>` : ""}
    <input class="${className}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${value}" aria-label="${f.name}">
    <span class="val ${isNeutral?'neutral':''}">${f.fmt(value)}</span>
  </div>`;
}
function layerBodyHTML(layer){
  const f = FILTERS[layer.type];
  if(layer.type === "superres"){
    const input = sourceReady ? layerInputSize(layer) : null;
    const t = input ? scaleTarget(input.w, input.h, layer.scale || 1) : null;
    return `<div class="layer-body">
      <div class="scale-row" role="group" aria-label="拡大率">
        ${f.scales.map(s=>`<button class="scale-btn ${layer.scale===s?'on':''}" data-s="${s}">×${s}</button>`).join("")}
      </div>
      ${sliderHTML(f, layer.value, "ディテール")}
      <div class="sr-out mono">${t
        ? `出力解像度: ${t.w} × ${t.h} px${t.clamped ? "(上限 "+MAX_OUT+"px に調整)" : ""}`
        : "画像を開くと出力解像度が表示されます"}</div>
    </div>`;
  }
  if(layer.type === "resize"){
    const input = sourceReady ? layerInputSize(layer) : null;
    if(input && (!layer.width || !layer.height)) updateResizeFromMode(layer, layer.mode || "1");
    const t = input ? resizeTarget(layer, input.w, input.h) : null;
    return `<div class="layer-body">
      <div class="scale-row" role="group" aria-label="リサイズ倍率">
        ${RESIZE_SCALES.map(s=>`<button class="scale-btn ${layer.mode===s.key?'on':''}" data-mode="${s.key}">${s.label}</button>`).join("")}
      </div>
      <div class="resize-size-row">
        <label class="size-box"><span>X</span><input class="num-input resize-w" type="number" min="1" max="${MAX_OUT}" step="1" inputmode="numeric" value="${layer.width || ''}"></label>
        <label class="size-box"><span>Y</span><input class="num-input resize-h" type="number" min="1" max="${MAX_OUT}" step="1" inputmode="numeric" value="${layer.height || ''}"></label>
      </div>
      <div class="quality-row" role="group" aria-label="リサイズ品質">
        ${Object.entries(QUALITY_LABELS).map(([key,label])=>`<button class="quality-btn ${layer.quality===key?'on':''}" data-q="${key}">品質：${label}</button>`).join("")}
      </div>
      <div class="sr-out mono">${input && t ? `入力: ${input.w} × ${input.h} px / 出力: ${t.w} × ${t.h} px` : "画像を開くと解像度が表示されます"}</div>
    </div>`;
  }
  if(layer.type === "grayscale"){
    return `<div class="layer-body">
      ${sliderHTML(f, layer.value)}
      <div class="color-row">
        <label class="color-box"><span>暗部</span><input class="color-input low-color" type="color" value="${layer.lowColor || '#000000'}"></label>
        <label class="color-box"><span>明部</span><input class="color-input high-color" type="color" value="${layer.highColor || '#ffffff'}"></label>
      </div>
    </div>`;
  }
  if(layer.type === "bias"){
    return `<div class="layer-body">
      ${paramSliderHTML("補正量", "bias-amount", 0, 200, 1, layer.value, layer.value+"%")}
      ${paramSliderHTML("局所平均", "bias-size", 15, 301, 2, layer.size, layer.size+"px")}
      ${paramSliderHTML("オフセット", "bias-offset", -80, 80, 1, layer.offset, (layer.offset>0?"+":"")+layer.offset)}
      ${paramSliderHTML("偏差しきい値", "bias-threshold", 0, 80, 1, layer.threshold, layer.threshold)}
      <div class="mobile-note">文書写真の影消し用です。局所平均を大きくすると、広い影・照明ムラを補正しやすくなります。</div>
    </div>`;
  }
  return `<div class="layer-body">${sliderHTML(f, layer.value)}</div>`;
}
function paramSliderHTML(label, cls, min, max, step, value, readout){
  return `<div class="param-row">
    <span class="mini-label">${label}</span>
    <input class="${cls}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}">
    <span class="val">${readout}</span>
  </div>`;
}
function wireLayerControls(card, layer){
  const f = FILTERS[layer.type];

  card.querySelector(".vis").addEventListener("click", ()=>toggleLayer(layer.id));
  card.querySelector(".del").addEventListener("click", ()=>removeLayer(layer.id));

  if(layer.type === "superres"){
    card.querySelectorAll(".scale-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        layer.scale = Number(btn.dataset.s);
        refreshResizeLayers();
        renderStack();
        scheduleRender();
      });
    });
    wireMainRange(card, layer, f);
    return;
  }

  if(layer.type === "resize"){
    card.querySelectorAll(".scale-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        updateResizeFromMode(layer, btn.dataset.mode);
        renderStack();
        scheduleRender();
      });
    });
    card.querySelectorAll(".quality-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        layer.quality = btn.dataset.q;
        renderStack();
        scheduleRender();
      });
    });
    const wInput = card.querySelector(".resize-w");
    const hInput = card.querySelector(".resize-h");
    const onSizeInput = ()=>{
      layer.mode = "custom";
      layer.width = clampInt(wInput.value, 1, MAX_OUT);
      layer.height = clampInt(hInput.value, 1, MAX_OUT);
      renderStack();
      scheduleRender();
    };
    wInput.addEventListener("change", onSizeInput);
    hInput.addEventListener("change", onSizeInput);
    wInput.addEventListener("input", ()=>{ layer.mode = "custom"; });
    hInput.addEventListener("input", ()=>{ layer.mode = "custom"; });
    return;
  }

  if(layer.type === "grayscale"){
    wireMainRange(card, layer, f);
    card.querySelector(".low-color").addEventListener("input", e=>{ layer.lowColor = e.target.value; scheduleRender(); });
    card.querySelector(".high-color").addEventListener("input", e=>{ layer.highColor = e.target.value; scheduleRender(); });
    return;
  }

  if(layer.type === "bias"){
    wireParam(card, ".bias-amount", layer, "value", v=>v+"%");
    wireParam(card, ".bias-size", layer, "size", v=>v+"px");
    wireParam(card, ".bias-offset", layer, "offset", v=>(v>0?"+":"")+v);
    wireParam(card, ".bias-threshold", layer, "threshold", v=>String(v));
    return;
  }

  wireMainRange(card, layer, f);
}
function wireMainRange(card, layer, f){
  const range = card.querySelector(".main-range");
  const val = card.querySelector(".val");
  if(!range) return;
  range.addEventListener("input", ()=>{
    layer.value = Number(range.value);
    val.textContent = f.fmt(layer.value);
    val.classList.toggle("neutral", layer.value===f.neutral);
    scheduleRender();
  });
}
function wireParam(card, selector, layer, prop, fmt){
  const input = card.querySelector(selector);
  const val = input && input.parentElement.querySelector(".val");
  if(!input) return;
  input.addEventListener("input", ()=>{
    layer[prop] = Number(input.value);
    if(val) val.textContent = fmt(layer[prop]);
    scheduleRender();
  });
}

/* ---------- drag to reorder ---------- */
let dragId = null;
function enableDrag(card, handle){
  handle.addEventListener("pointerdown", ()=>{ card.setAttribute("draggable","true"); });
  ["pointerup","pointercancel"].forEach(ev=>
    handle.addEventListener(ev, ()=>card.removeAttribute("draggable")));

  card.addEventListener("dragstart", e=>{
    dragId = Number(card.dataset.id);
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", dragId); }catch(_){}
  });
  card.addEventListener("dragend", ()=>{
    card.classList.remove("dragging");
    card.removeAttribute("draggable");
    commitOrderFromDOM();
    dragId = null;
  });
}
stackList.addEventListener("dragover", e=>{
  e.preventDefault();
  const dragging = stackList.querySelector(".dragging");
  if(!dragging) return;
  const after = getDragAfter(stackList, e.clientY);
  if(after == null) stackList.appendChild(dragging);
  else stackList.insertBefore(dragging, after);
});
function getDragAfter(container, y){
  const cards = [...container.querySelectorAll(".layer:not(.dragging)")];
  return cards.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > closest.offset)
      return { offset, element:child };
    return closest;
  }, { offset:-Infinity, element:null }).element;
}
function commitOrderFromDOM(){
  const order = [...stackList.querySelectorAll(".layer")].map(c=>Number(c.dataset.id));
  layers.sort((a,b)=> order.indexOf(a.id) - order.indexOf(b.id));
  refreshResizeLayers();
  renderStack();
  scheduleRender();
}

/* ---------- image processing pipeline ---------- */
function getBaseCanvas(){
  const b = baseDimensions();
  return drawImageToCanvas(img, b.w, b.h, "high");
}

function renderPipeline(showOriginal=false){
  let cur = getBaseCanvas();
  if(showOriginal) return cur;

  for(const layer of layers){
    if(!layer.enabled) continue;
    switch(layer.type){
      case "superres": cur = applySuperResolution(cur, layer); break;
      case "resize": cur = applyResize(cur, layer); break;
      case "blur": cur = applyBlur(cur, layer.value); break;
      case "bias": cur = applyBiasCorrection(cur, layer); break;
      case "quantize": cur = applyQuantize(cur, layer.value); break;
      default: cur = applyPixelFilter(cur, layer); break;
    }
    cur = pixelLimitCanvas(cur);
  }
  return cur;
}

function applyResize(src, layer){
  const t = resizeTarget(layer, src.width, src.height);
  if(t.clamped) toast(`リサイズ後の最大辺を ${MAX_OUT}px に調整しました`);
  return drawImageToCanvas(src, t.w, t.h, layer.quality || "medium");
}

function applySuperResolution(src, layer){
  const t = scaleTarget(src.width, src.height, layer.scale || 1);
  if(t.clamped) toast(`超解像の最大辺を ${MAX_OUT}px に調整しました`);

  let cur = src;
  let cw = src.width, ch = src.height;
  while(cw * 2 <= t.w && ch * 2 <= t.h){
    cur = drawImageToCanvas(cur, cw*2, ch*2, "high");
    cw = cur.width; ch = cur.height;
  }
  cur = drawImageToCanvas(cur, t.w, t.h, "high");
  if((layer.value || 0) > 0.5) cur = applySharpen(cur, (layer.value/100) * 1.1);
  return cur;
}

function applyPixelFilter(src, layer){
  const f = FILTERS[layer.type];
  if(!f || Number(layer.value) === f.neutral) return copyCanvas(src);

  const c = copyCanvas(src);
  const x = c.getContext("2d", { willReadFrequently:true });
  const imgData = x.getImageData(0,0,c.width,c.height);
  const d = imgData.data;
  const v = Number(layer.value);
  const type = layer.type;
  const low = type === "grayscale" ? hexToRgb(layer.lowColor || "#000000") : null;
  const high = type === "grayscale" ? hexToRgb(layer.highColor || "#ffffff") : null;
  const hueRad = type === "hue" ? v * Math.PI / 180 : 0;
  const cosH = Math.cos(hueRad), sinH = Math.sin(hueRad);

  for(let i=0;i<d.length;i+=4){
    let r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
    if(type === "brightness"){
      const m = v/100; r*=m; g*=m; b*=m;
    } else if(type === "contrast"){
      const m = v/100; r=(r-128)*m+128; g=(g-128)*m+128; b=(b-128)*m+128;
    } else if(type === "opacity"){
      a *= v/100;
    } else if(type === "saturate"){
      const m = v/100, lum = 0.2126*r + 0.7152*g + 0.0722*b;
      r = lum + (r-lum)*m; g = lum + (g-lum)*m; b = lum + (b-lum)*m;
    } else if(type === "hue"){
      // CSS hue-rotate に近い輝度保持の回転行列
      const nr = (0.213 + cosH*0.787 - sinH*0.213)*r + (0.715 - cosH*0.715 - sinH*0.715)*g + (0.072 - cosH*0.072 + sinH*0.928)*b;
      const ng = (0.213 - cosH*0.213 + sinH*0.143)*r + (0.715 + cosH*0.285 + sinH*0.140)*g + (0.072 - cosH*0.072 - sinH*0.283)*b;
      const nb = (0.213 - cosH*0.213 - sinH*0.787)*r + (0.715 - cosH*0.715 + sinH*0.715)*g + (0.072 + cosH*0.928 + sinH*0.072)*b;
      r=nr; g=ng; b=nb;
    } else if(type === "sepia"){
      const m = v/100;
      const nr = r*0.393 + g*0.769 + b*0.189;
      const ng = r*0.349 + g*0.686 + b*0.168;
      const nb = r*0.272 + g*0.534 + b*0.131;
      r = r*(1-m) + nr*m; g = g*(1-m) + ng*m; b = b*(1-m) + nb*m;
    } else if(type === "grayscale"){
      const m = v/100;
      const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      const tr = low[0]*(1-lum) + high[0]*lum;
      const tg = low[1]*(1-lum) + high[1]*lum;
      const tb = low[2]*(1-lum) + high[2]*lum;
      r = r*(1-m) + tr*m; g = g*(1-m) + tg*m; b = b*(1-m) + tb*m;
    } else if(type === "invert"){
      const m = v/100;
      r = r*(1-m) + (255-r)*m; g = g*(1-m) + (255-g)*m; b = b*(1-m) + (255-b)*m;
    }
    d[i]=clamp(r); d[i+1]=clamp(g); d[i+2]=clamp(b); d[i+3]=clamp(a);
  }
  x.putImageData(imgData,0,0);
  return c;
}

function applyQuantize(src, colors){
  colors = clampInt(colors, 2, 256);
  if(colors >= 256) return copyCanvas(src);
  const c = copyCanvas(src);
  const x = c.getContext("2d", { willReadFrequently:true });
  const imgData = x.getImageData(0,0,c.width,c.height);
  const d = imgData.data;

  // 軽量化優先: k-means ではなく、指定色数に近いチャンネル段階数へ高速量子化する。
  // スマホでも操作中に止まりにくく、写真/イラストの両方で破綻しにくい。
  const levels = Math.max(2, Math.round(Math.cbrt(colors)));
  const step = 255 / (levels - 1);
  for(let i=0;i<d.length;i+=4){
    d[i]   = Math.round(d[i]   / step) * step;
    d[i+1] = Math.round(d[i+1] / step) * step;
    d[i+2] = Math.round(d[i+2] / step) * step;
  }
  x.putImageData(imgData,0,0);
  return c;
}

function applySharpen(src, amount){
  if(amount <= 0.001) return copyCanvas(src);
  const c = copyCanvas(src);
  const x = c.getContext("2d", { willReadFrequently:true });
  const w=c.width, h=c.height;
  const imgData = x.getImageData(0,0,w,h);
  const srcData = new Uint8ClampedArray(imgData.data);
  const d = imgData.data;
  const center = 1 + 4*amount;
  const side = -amount;

  for(let y=0;y<h;y++){
    const ym = Math.max(0,y-1), yp = Math.min(h-1,y+1);
    for(let x0=0;x0<w;x0++){
      const xm = Math.max(0,x0-1), xp = Math.min(w-1,x0+1);
      const i = (y*w+x0)*4;
      const il = (y*w+xm)*4, ir=(y*w+xp)*4, iu=(ym*w+x0)*4, id=(yp*w+x0)*4;
      for(let ch=0; ch<3; ch++){
        d[i+ch] = clamp(srcData[i+ch]*center + (srcData[il+ch]+srcData[ir+ch]+srcData[iu+ch]+srcData[id+ch])*side);
      }
    }
  }
  x.putImageData(imgData,0,0);
  return c;
}

function applyBlur(src, radius){
  radius = Math.round(Number(radius));
  if(radius <= 0) return copyCanvas(src);
  const c = copyCanvas(src);
  const x = c.getContext("2d", { willReadFrequently:true });
  const w=c.width, h=c.height;
  const imgData = x.getImageData(0,0,w,h);
  const srcData = imgData.data;
  const tmp = new Uint8ClampedArray(srcData.length);
  const out = imgData.data;
  const div = radius*2 + 1;

  // horizontal pass
  for(let y=0;y<h;y++){
    let sr=0, sg=0, sb=0, sa=0;
    for(let ix=-radius; ix<=radius; ix++){
      const px = Math.min(w-1, Math.max(0, ix));
      const i = (y*w+px)*4;
      sr+=srcData[i]; sg+=srcData[i+1]; sb+=srcData[i+2]; sa+=srcData[i+3];
    }
    for(let x0=0;x0<w;x0++){
      const i = (y*w+x0)*4;
      tmp[i]=sr/div; tmp[i+1]=sg/div; tmp[i+2]=sb/div; tmp[i+3]=sa/div;
      const removeX = Math.max(0, x0-radius);
      const addX = Math.min(w-1, x0+radius+1);
      const ri=(y*w+removeX)*4, ai=(y*w+addX)*4;
      sr += srcData[ai]-srcData[ri]; sg += srcData[ai+1]-srcData[ri+1]; sb += srcData[ai+2]-srcData[ri+2]; sa += srcData[ai+3]-srcData[ri+3];
    }
  }
  // vertical pass
  for(let x0=0;x0<w;x0++){
    let sr=0, sg=0, sb=0, sa=0;
    for(let iy=-radius; iy<=radius; iy++){
      const py = Math.min(h-1, Math.max(0, iy));
      const i = (py*w+x0)*4;
      sr+=tmp[i]; sg+=tmp[i+1]; sb+=tmp[i+2]; sa+=tmp[i+3];
    }
    for(let y=0;y<h;y++){
      const i = (y*w+x0)*4;
      out[i]=sr/div; out[i+1]=sg/div; out[i+2]=sb/div; out[i+3]=sa/div;
      const removeY = Math.max(0, y-radius);
      const addY = Math.min(h-1, y+radius+1);
      const ri=(removeY*w+x0)*4, ai=(addY*w+x0)*4;
      sr += tmp[ai]-tmp[ri]; sg += tmp[ai+1]-tmp[ri+1]; sb += tmp[ai+2]-tmp[ri+2]; sa += tmp[ai+3]-tmp[ri+3];
    }
  }
  x.putImageData(imgData,0,0);
  return c;
}

function applyBiasCorrection(src, layer){
  const amount = (layer.value || 0) / 100;
  if(amount <= 0) return copyCanvas(src);
  const c = copyCanvas(src);
  const x = c.getContext("2d", { willReadFrequently:true });
  const w=c.width, h=c.height;
  const imgData = x.getImageData(0,0,w,h);
  const d = imgData.data;
  const iw = w + 1;
  const integral = new Float32Array((w+1)*(h+1));
  let global = 0;

  for(let y=1;y<=h;y++){
    let row = 0;
    for(let xx=1;xx<=w;xx++){
      const i = ((y-1)*w + (xx-1))*4;
      const lum = 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2];
      row += lum;
      global += lum;
      integral[y*iw + xx] = integral[(y-1)*iw + xx] + row;
    }
  }
  global /= (w*h || 1);
  const radius = Math.max(1, Math.round((layer.size || 121)/2));
  const offset = Number(layer.offset || 0);
  const threshold = Number(layer.threshold || 0);
  const target = global + offset;

  for(let y=0;y<h;y++){
    const y1 = Math.max(0, y-radius), y2 = Math.min(h-1, y+radius);
    for(let xx=0;xx<w;xx++){
      const x1 = Math.max(0, xx-radius), x2 = Math.min(w-1, xx+radius);
      const area = (x2-x1+1) * (y2-y1+1);
      const sum = integral[(y2+1)*iw + (x2+1)] - integral[y1*iw + (x2+1)] - integral[(y2+1)*iw + x1] + integral[y1*iw + x1];
      const local = sum / area;
      const deviation = local - global;
      if(Math.abs(deviation) < threshold) continue;
      const delta = (target - local) * amount;
      const i = (y*w+xx)*4;
      d[i] = clamp(d[i] + delta);
      d[i+1] = clamp(d[i+1] + delta);
      d[i+2] = clamp(d[i+2] + delta);
    }
  }
  x.putImageData(imgData,0,0);
  return c;
}

let pendingRender = false;
function scheduleRender(){
  if(pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(()=>{
    pendingRender = false;
    try{ render(); }catch(err){ toast("描画エラー: " + (err.message || err)); }
  });
}

function render(showOriginal=false){
  if(!sourceReady) return;
  const out = renderPipeline(showOriginal);
  if(canvas.width!==out.width || canvas.height!==out.height){ canvas.width=out.width; canvas.height=out.height; }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(out, 0, 0);

  const finalW = out.width, finalH = out.height;
  const baseW = img.naturalWidth, baseH = img.naturalHeight;
  if(!showOriginal && (finalW !== baseW || finalH !== baseH)){
    const ratio = Math.round((finalW / baseW) * 100) / 100;
    stageTag.textContent = `${baseW} × ${baseH} → ${finalW} × ${finalH} px (×${ratio})`;
  } else {
    stageTag.textContent = `${baseW} × ${baseH} px`;
  }

  if(out.width * out.height > MAX_PIXELS_NOTICE){
    console.warn("Large canvas:", out.width, out.height);
  }
}

/* ---------- loading images ---------- */
function loadFromURL(url){
  const tmp = new Image();
  tmp.crossOrigin = "anonymous";
  tmp.onload = ()=>{
    img.onload = ()=>{
      sourceReady = true;
      imgGen++;
      empty.classList.add("hidden");
      canvasWrap.classList.remove("hidden");
      stageUI.classList.remove("hidden");
      $("btnSave").disabled = false;
      $("btnCompare").disabled = false;
      resetView();
      refreshResizeLayers();
      renderStack();
      render();
      if(!zoomHintShown){
        toast(IS_COARSE ? "プレビューは2本指で拡大縮小、1本指で移動できます" : "プレビューはホイールで拡大縮小、ドラッグで移動できます");
        zoomHintShown = true;
      }
    };
    img.onerror = ()=> toast("画像を表示できませんでした");
    img.src = url;
  };
  tmp.onerror = ()=> toast("画像を読み込めませんでした");
  tmp.src = url;
}
function handleFile(file){
  if(!file){ return; }
  if(!file.type.startsWith("image/")){
    toast("画像ファイルではありません。JPG・PNG・WebP をお試しください");
    return;
  }
  loadFromURL(URL.createObjectURL(file));
}

function loadSample(){
  const c = document.createElement("canvas");
  c.width = 1200; c.height = 800;
  const x = c.getContext("2d");
  const g = x.createLinearGradient(0,0,1200,800);
  g.addColorStop(0,"#2b3a8f"); g.addColorStop(.5,"#9c3d8a"); g.addColorStop(1,"#e6a23c");
  x.fillStyle = g; x.fillRect(0,0,1200,800);
  [["#ffd27d",300,260,200],["#5be0c8",880,300,170],["#ff7a9c",640,560,150],["#7fb0ff",980,620,120]]
    .forEach(([col,cx,cy,r])=>{
      const rg = x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,col); rg.addColorStop(1,"rgba(0,0,0,0)");
      x.fillStyle = rg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
    });
  x.strokeStyle = "rgba(255,255,255,.10)"; x.lineWidth = 1;
  for(let i=0;i<=1200;i+=60){ x.beginPath();x.moveTo(i,0);x.lineTo(i,800);x.stroke(); }
  for(let i=0;i<=800;i+=60){ x.beginPath();x.moveTo(0,i);x.lineTo(1200,i);x.stroke(); }
  x.fillStyle = "rgba(255,255,255,.92)";
  x.font = "700 96px 'Space Grotesk', sans-serif";
  x.fillText("PRISM", 80, 460);
  loadFromURL(c.toDataURL("image/png"));
}

/* ---------- export ---------- */
function saveImage(){
  if(!sourceReady) return;
  render(false);
  canvas.toBlob(blob=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "prism-export.png";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("PNG として書き出しました");
  }, "image/png");
}

/* ---------- compare (hold) ---------- */
function setCompare(on){
  if(!sourceReady) return;
  compareFlag.classList.toggle("on", on);
  render(on);
}

/* ---------- preview zoom & pan ---------- */
const view = { z:1, tx:0, ty:0 };
let zoomHintShown = false;

function applyView(){
  canvasWrap.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.z})`;
  zoomTag.textContent = Math.round(view.z*100) + "%";
}
function resetView(){
  view.z = 1; view.tx = 0; view.ty = 0;
  applyView();
}
function zoomAt(clientX, clientY, newZ){
  const p = stagePoint(clientX, clientY);
  const nz = Math.min(12, Math.max(0.2, newZ));
  view.tx = p.x - (p.x - view.tx) * (nz / view.z);
  view.ty = p.y - (p.y - view.ty) * (nz / view.z);
  view.z = nz;
  applyView();
}

stage.addEventListener("wheel", e=>{
  if(!sourceReady) return;
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, view.z * Math.exp(-e.deltaY * 0.0016));
}, { passive:false });

const activePointers = new Map();
let panStart = null;
let pinchStart = null;

canvasWrap.addEventListener("pointerdown", e=>{
  if(!sourceReady) return;
  if(e.pointerType === "mouse" && e.button !== 0) return;
  e.preventDefault();
  activePointers.set(e.pointerId, { clientX:e.clientX, clientY:e.clientY });
  canvasWrap.setPointerCapture(e.pointerId);
  canvasWrap.classList.add("panning");

  if(activePointers.size === 1){
    panStart = { x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty };
    pinchStart = null;
  } else if(activePointers.size === 2){
    const pts = [...activePointers.values()];
    const mid = midpoint(pts[0], pts[1]);
    const sp = stagePoint(mid.clientX, mid.clientY);
    pinchStart = { dist:distance(pts[0], pts[1]), cx:sp.x, cy:sp.y, tx:view.tx, ty:view.ty, z:view.z };
    panStart = null;
  }
}, { passive:false });

canvasWrap.addEventListener("pointermove", e=>{
  if(!activePointers.has(e.pointerId)) return;
  e.preventDefault();
  activePointers.set(e.pointerId, { clientX:e.clientX, clientY:e.clientY });

  if(activePointers.size >= 2 && pinchStart){
    const pts = [...activePointers.values()].slice(0,2);
    const mid = midpoint(pts[0], pts[1]);
    const sp = stagePoint(mid.clientX, mid.clientY);
    const nz = Math.min(12, Math.max(0.2, pinchStart.z * (distance(pts[0], pts[1]) / Math.max(1, pinchStart.dist))));
    view.tx = sp.x - (pinchStart.cx - pinchStart.tx) * (nz / pinchStart.z);
    view.ty = sp.y - (pinchStart.cy - pinchStart.ty) * (nz / pinchStart.z);
    view.z = nz;
    applyView();
  } else if(activePointers.size === 1 && panStart){
    view.tx = panStart.tx + (e.clientX - panStart.x);
    view.ty = panStart.ty + (e.clientY - panStart.y);
    applyView();
  }
}, { passive:false });

function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size === 0){
    panStart = null; pinchStart = null;
    canvasWrap.classList.remove("panning");
    return;
  }
  if(activePointers.size === 1){
    const p = [...activePointers.values()][0];
    panStart = { x:p.clientX, y:p.clientY, tx:view.tx, ty:view.ty };
    pinchStart = null;
  }
}
["pointerup","pointercancel","pointerleave"].forEach(ev=>canvasWrap.addEventListener(ev, endPointer));
canvasWrap.addEventListener("dblclick", resetView);
zoomTag.addEventListener("click", resetView);

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 3200);
}

/* ---------- wiring ---------- */
function openPicker(){ fileInput.value=""; fileInput.click(); }
$("btnOpen").addEventListener("click", openPicker);
$("emptyOpen").addEventListener("click", openPicker);
$("emptySample").addEventListener("click", loadSample);
$("btnSave").addEventListener("click", saveImage);
$("btnClear").addEventListener("click", clearAll);
fileInput.addEventListener("change", e=> handleFile(e.target.files[0]));

const cmp = $("btnCompare");
cmp.addEventListener("pointerdown", ()=>setCompare(true));
["pointerup","pointerleave","pointercancel"].forEach(ev=>
  cmp.addEventListener(ev, ()=>setCompare(false)));

["dragenter","dragover"].forEach(ev=>
  stage.addEventListener(ev, e=>{ e.preventDefault(); empty.classList.add("drag"); }));
["dragleave","drop"].forEach(ev=>
  stage.addEventListener(ev, e=>{ e.preventDefault(); empty.classList.remove("drag"); }));
stage.addEventListener("drop", e=>{
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file) handleFile(file);
});

// init
buildAddGrid();
renderStack();
</script>
