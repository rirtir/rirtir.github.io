<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Frame Extractor</title>

<link rel="stylesheet" href="./../../css/common-style.css">
<link rel="stylesheet" href="./../../css/common-style2.css">
<style>
video{
width:100%;
max-height:240px;
background:black;
}

#slider{
width:100%;
}

.frameButtons{
display:flex;
gap:10px;
}

</style>
</head>

<body>

<h1>動画フレーム抽出</h1>

<div id="dropArea">
動画をドラッグ&ドロップ<br>
またはクリックして選択
</div>

<input type="file" id="fileInput" accept="video/*" hidden>

<div id="controls">

<video id="video" controls></video>

<input type="range" id="slider" min="0" max="0" step="0.01">

<div class="frameButtons">
<button id="prevFrame">◀ 1/30秒</button>
<button id="nextFrame">1/30秒 ▶</button>
</div>

<button id="capture">このフレームを画像化</button>

<button id="download" disabled>画像ダウンロード</button>

</div>

<p id="status" role="status" aria-live="polite"></p>
<canvas id="canvas"></canvas>

<script src="./app.js"></script>

</body>
</html>
