<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AIR HOCKEY — ファミコン風エアホッケー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

<!-- ============================================================
     CSS
============================================================ -->
<style>
:root{
  --bg:        #0E1530;  /* ページ背景 */
  --panel:     #1A2342;  /* ヘッダー・カード */
  --panel-hi:  #242E55;  /* ホバー */
  --line:      #39406B;  /* 枠線 */
  --text:      #EAEFFF;  /* 基本文字 */
  --text-dim:  #8E97C2;  /* 補助文字 */
  --puck:      #FFD93D;  /* アクセント(パック色) */
  --player:    #5DCAA5;  /* プレイヤー色 */
  --cpu:       #AFA9EC;  /* CPU色 */
  --danger:    #E24B4A;
  --font-ui:   'DotGothic16', monospace;
  --font-logo: 'Press Start 2P', monospace;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{
  height:100dvh; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:16px;
  touch-action:none; overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
}

/* ---- ヘッダー(筐体マーキー風) ---- */
header{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 14px;
  background:var(--panel);
  border-bottom:4px solid var(--line);
}
.logo{
  font-family:var(--font-logo); font-size:14px; letter-spacing:1px;
  color:var(--puck); display:flex; align-items:center; gap:10px;
}
.logo .dot{
  width:12px; height:12px; border-radius:50%;
  background:var(--puck);
  animation:blink 1.2s steps(2,start) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){ .logo .dot{ animation:none; } }
.spacer{ flex:1; }
.hud{
  font-size:14px; color:var(--text-dim); white-space:nowrap;
}
.hud b{ color:var(--text); font-weight:normal; }

/* ---- ピクセル風ボタン ---- */
.btn{
  font-family:var(--font-ui); font-size:15px;
  color:var(--text); background:var(--panel);
  border:3px solid var(--line);
  padding:6px 14px; cursor:pointer; line-height:1.2;
  box-shadow:0 3px 0 #070B1D;
}
.btn:hover{ background:var(--panel-hi); }
.btn:active{ transform:translateY(3px); box-shadow:none; }
.btn:focus-visible{ outline:3px solid var(--puck); outline-offset:2px; }
.btn:disabled{ opacity:.4; cursor:default; transform:none; box-shadow:0 3px 0 #070B1D; }
.btn.accent{ border-color:var(--puck); color:var(--puck); }

/* ---- ゲームステージ ---- */
main{
  position:relative;
  height:calc(100dvh - var(--header-h, 58px));
  display:flex; align-items:center; justify-content:center;
}
#stage{ position:relative; }
canvas{ display:block; cursor:none; touch-action:none; }

/* ---- キャンバス上のオーバーレイ(タイトル/結果) ---- */
.overlay{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; text-align:center;
  background:rgba(7,11,29,.78);
}
.overlay[hidden]{ display:none; }
.overlay .title{
  font-family:var(--font-logo); font-size:clamp(18px, 5vw, 30px);
  color:var(--puck); line-height:1.6;
}
.overlay .sub{ color:var(--text-dim); font-size:15px; }
.overlay .result{ font-size:clamp(24px, 6vw, 34px); }
.overlay .result.win{ color:var(--player); }
.overlay .result.lose{ color:var(--danger); }

/* ---- 難易度ポップアップ ---- */
#modal{
  position:fixed; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:rgba(7,11,29,.7);
}
#modal[hidden]{ display:none; }
.modal-box{
  background:var(--panel);
  border:4px solid var(--puck);
  box-shadow:0 0 0 4px #070B1D;
  padding:20px 22px; width:min(92vw, 360px);
}
.modal-box h2{
  font-size:18px; font-weight:normal; color:var(--puck);
  margin-bottom:14px; text-align:center;
}
.diff-list{ display:flex; flex-direction:column; gap:10px; }
.diff-btn{
  display:flex; align-items:center; gap:12px;
  width:100%; text-align:left;
  font-family:var(--font-ui); font-size:16px;
  color:var(--text); background:var(--bg);
  border:3px solid var(--line); padding:10px 12px; cursor:pointer;
}
.diff-btn:hover{ background:var(--panel-hi); border-color:var(--d-col); }
.diff-btn:focus-visible{ outline:3px solid var(--puck); outline-offset:2px; }
.diff-btn .mark{
  width:14px; height:14px; flex:none;
  background:var(--d-col); border-radius:50%;
}
.diff-btn small{ display:block; color:var(--text-dim); font-size:13px; }
.modal-close{ margin-top:14px; width:100%; }

/* ---- スマホ調整 ---- */
@media (max-width: 480px){
  header{ gap:8px; padding:8px 10px; }
  .logo{ font-size:11px; }
  .btn{ font-size:13px; padding:5px 9px; }
  .hud{ font-size:12px; }
}
</style>
</head>

<!-- ============================================================
     HTML
============================================================ -->
<body>
<header id="header">
  <div class="logo"><span class="dot" aria-hidden="true"></span>AIR HOCKEY</div>
  <span class="hud" id="hud">なんいど: <b>--</b></span>
  <div class="spacer"></div>
  <button class="btn" id="restartBtn" disabled>リスタート</button>
  <button class="btn" id="diffBtn">なんいど</button>
  <button class="btn" id="soundBtn" aria-label="サウンド切替">おと ON</button>
</header>

<main>
  <div id="stage">
    <canvas id="cv" width="400" height="580"></canvas>

    <!-- タイトル画面 -->
    <div class="overlay" id="titleOverlay">
      <div class="title">AIR<br>HOCKEY</div>
      <div class="sub">さきに 7てん とったほうの かち</div>
      <button class="btn accent" id="startBtn">ゲームスタート</button>
    </div>

    <!-- リザルト画面 -->
    <div class="overlay" id="overOverlay" hidden>
      <div class="result" id="overText">きみの かち！</div>
      <div class="sub" id="overScore">7 - 0</div>
      <button class="btn accent" id="againBtn">もういちど</button>
    </div>
  </div>
</main>

<!-- 難易度選択ポップアップ -->
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle">なんいど を えらんでね</h2>
    <div class="diff-list" id="diffList"></div>
    <button class="btn modal-close" id="modalClose">とじる</button>
  </div>
</div>

<!-- ============================================================
     JavaScript
============================================================ -->
<script>
(() => {
'use strict';

/* ---------- 定数 ---------- */
const W=400, H=580, GOAL=130, PR=24, AR=26, PKR=15, WIN=7;
const DIFFS=[
  {name:'よわい',   desc:'はんのうが にぶい',     spd:2.6,  err:70, react:0.5,  atk:0.5,  col:'#5DCAA5'},
  {name:'ふつう',   desc:'バランスがた',           spd:4.6,  err:34, react:0.75, atk:0.8,  col:'#85B7EB'},
  {name:'つよい',   desc:'すばやく せいかく',      spd:7.2,  err:12, react:0.92, atk:1.0,  col:'#EF9F27'},
  {name:'さいきょう', desc:'よそく して うごく',   spd:10.5, err:3,  react:1.0,  atk:1.25, col:'#E24B4A'}
];

/* ---------- DOM ---------- */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const headerEl=document.getElementById('header');
const hud=document.getElementById('hud');
const restartBtn=document.getElementById('restartBtn');
const diffBtn=document.getElementById('diffBtn');
const soundBtn=document.getElementById('soundBtn');
const startBtn=document.getElementById('startBtn');
const againBtn=document.getElementById('againBtn');
const modal=document.getElementById('modal');
const modalClose=document.getElementById('modalClose');
const diffList=document.getElementById('diffList');
const titleOverlay=document.getElementById('titleOverlay');
const overOverlay=document.getElementById('overOverlay');
const overText=document.getElementById('overText');
const overScore=document.getElementById('overScore');

/* ---------- レスポンシブ・サイズ調整 ---------- */
const dpr=Math.min(window.devicePixelRatio||1, 2);
let viewScale=1;
function fitCanvas(){
  document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight+'px');
  const margin = window.innerWidth < 480 ? 0.94 : 0.92;   /* スマホは横幅ほぼいっぱい(少し余白=領域外操作用) */
  const availW = window.innerWidth  * margin;
  const availH = (window.innerHeight - headerEl.offsetHeight) * 0.96;
  viewScale = Math.min(availW/W, availH/H);
  cv.style.width  = (W*viewScale)+'px';
  cv.style.height = (H*viewScale)+'px';
  cv.width  = Math.round(W*viewScale*dpr);
  cv.height = Math.round(H*viewScale*dpr);
  ctx.setTransform(viewScale*dpr, 0, 0, viewScale*dpr, 0, 0);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,100));
fitCanvas();

/* ---------- ファミコン風サウンド ---------- */
let muted=false, AC=null;
function ac(){
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function blip(freq,dur,type,vol,slide){
  if(muted) return;
  try{
    const a=ac(), t=a.currentTime;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t+dur);
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noiseHit(vol){
  if(muted) return;
  try{
    const a=ac(), t=a.currentTime, len=a.sampleRate*0.08;
    const buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=a.createBufferSource(), g=a.createGain();
    s.buffer=buf; g.gain.value=vol||0.1;
    s.connect(g); g.connect(a.destination); s.start(t);
  }catch(e){}
}
function jingle(notes,step,type){
  notes.forEach((n,i)=> setTimeout(()=>blip(n,0.14,type||'square',0.13), i*step));
}

/* ---------- ゲーム状態 ---------- */
let diffIdx=-1, diff=null;
let state='title';            /* title / play / goal / over */
let paused=false;             /* ポップアップ表示中の一時停止 */
let puck={x:W/2, y:H/2, vx:0, vy:0};
let pl  ={x:W/2, y:H-90, vx:0, vy:0};
let aiP ={x:W/2, y:90,   vx:0, vy:0};
let scoreP=0, scoreA=0;
let particles=[], trail=[], shake=0, flashMsg='', flashT=0;
let pointer={x:W/2, y:H-90};
let hitCd=0, wallCd=0, aiMode='normal', aiT=0, stuck=0;

function resetPuck(toPlayer){
  puck.x=W/2; puck.y=H/2+(toPlayer?70:-70); puck.vx=0; puck.vy=0;
  pl.x=W/2; pl.y=H-90; pointer={x:W/2, y:H-90};
  aiP.x=W/2; aiP.y=90;
  aiMode='normal'; stuck=0; trail=[];
}
function startGame(d){
  diffIdx=d; diff=DIFFS[d];
  scoreP=0; scoreA=0; state='play'; paused=false;
  resetPuck(true);
  titleOverlay.hidden=true; overOverlay.hidden=true;
  restartBtn.disabled=false;
  hud.innerHTML='なんいど: <b style="color:'+diff.col+'">'+diff.name+'</b>';
  jingle([523,659,784,1047],70);
}

/* ---------- UI制御 ---------- */
DIFFS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='diff-btn';
  b.style.setProperty('--d-col', d.col);
  b.innerHTML='<span class="mark" aria-hidden="true"></span><span>'+d.name+'<small>'+d.desc+'</small></span>';
  b.addEventListener('click', ()=>{ ac(); closeModal(); startGame(i); });
  diffList.appendChild(b);
});
function openModal(){
  if(state==='play'){ paused=true; }
  modal.hidden=false;
}
function closeModal(){
  modal.hidden=true;
  paused=false;
}
diffBtn.addEventListener('click', openModal);
startBtn.addEventListener('click', ()=>{ ac(); openModal(); });
againBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
restartBtn.addEventListener('click', ()=>{ if(diffIdx>=0) startGame(diffIdx); });
soundBtn.addEventListener('click', ()=>{
  muted=!muted;
  soundBtn.textContent = muted ? 'おと OFF' : 'おと ON';
  if(!muted) blip(880,0.08,'square',0.1);
});

/* ---------- 入力(コート外でも追従) ---------- */
function toCanvas(cx,cy){
  const r=cv.getBoundingClientRect();
  return { x:(cx-r.left)/r.width*W, y:(cy-r.top)/r.height*H };
}
window.addEventListener('pointermove', e=>{ pointer=toCanvas(e.clientX,e.clientY); });
window.addEventListener('pointerdown', e=>{ if(e.target.closest('button')||e.target.closest('#modal')) return; pointer=toCanvas(e.clientX,e.clientY); });
window.addEventListener('touchmove', e=>{
  const t=e.touches[0];
  pointer=toCanvas(t.clientX,t.clientY);
}, {passive:true});
cv.addEventListener('touchmove', e=>{ e.preventDefault(); }, {passive:false});

/* ---------- パーティクル ---------- */
function spawnParticles(x,y,col,n,pow){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=(Math.random()*0.7+0.3)*(pow||4);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col});
  }
}

/* ---------- 物理 ---------- */
function calcVel(p,tx,ty,maxSpd,minX,maxX,minY,maxY){
  let nx=tx, ny=ty;
  const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
  if(maxSpd && d>maxSpd){ nx=p.x+dx/d*maxSpd; ny=p.y+dy/d*maxSpd; }
  nx=Math.max(minX,Math.min(maxX,nx));
  ny=Math.max(minY,Math.min(maxY,ny));
  p.vx=nx-p.x; p.vy=ny-p.y;
}
function collide(p,r){
  const dx=puck.x-p.x, dy=puck.y-p.y, d=Math.hypot(dx,dy), min=r+PKR;
  if(d<min && d>0.001){
    const nx=dx/d, ny=dy/d;
    puck.x=p.x+nx*min; puck.y=p.y+ny*min;
    const dot=puck.vx*nx+puck.vy*ny;
    if(dot<0){ puck.vx-=2*dot*nx; puck.vy-=2*dot*ny; }
    puck.vx+=p.vx*0.9; puck.vy+=p.vy*0.9;
    puck.vx+=nx*1.2;   puck.vy+=ny*1.2;
    const spd=Math.hypot(puck.vx,puck.vy), cap=16;
    if(spd>cap){ puck.vx*=cap/spd; puck.vy*=cap/spd; }
    if(hitCd<=0){
      blip(220+Math.random()*60,0.07,'square',0.12,-80);
      noiseHit(0.08);
      spawnParticles(puck.x,puck.y,'#FFD93D',8,5);
      shake=4; hitCd=6;
    }
  }
}
function wallsAndGoals(){
  const gl=(W-GOAL)/2, gr=(W+GOAL)/2;
  let bounced=false;
  if(puck.x<PKR){   puck.x=PKR;   puck.vx= Math.abs(puck.vx); bounced=true; }
  if(puck.x>W-PKR){ puck.x=W-PKR; puck.vx=-Math.abs(puck.vx); bounced=true; }
  if(puck.y<PKR){
    if(puck.x>gl && puck.x<gr){ if(puck.y<-PKR) return 'goalP'; }
    else { puck.y=PKR; puck.vy=Math.abs(puck.vy); bounced=true; }
  }
  if(puck.y>H-PKR){
    if(puck.x>gl && puck.x<gr){ if(puck.y>H+PKR) return 'goalA'; }
    else { puck.y=H-PKR; puck.vy=-Math.abs(puck.vy); bounced=true; }
  }
  if(bounced && wallCd<=0){ blip(440,0.05,'square',0.08,-100); wallCd=5; }
  return null;
}

/* ---------- 敵AI ---------- */
function aiThink(){
  const d=diff, homeY=80;
  const spd=Math.hypot(puck.vx,puck.vy);
  if(puck.y<H/2 && spd<0.7) stuck++; else stuck=Math.max(0,stuck-2);
  if(aiMode==='normal' && stuck>40){ aiMode='back'; aiT=28; }
  let tx, ty, ms=d.spd;
  const gx=W/2, gy=H+40;
  if(aiMode==='back'){                        /* ハマり: いったん下がる */
    tx=W/2; ty=homeY; ms=d.spd*1.3+2;
    if(--aiT<=0){ aiMode='dash'; aiT=55; }
  } else if(aiMode==='dash'){                 /* ハマり: 中央へ弾き出す */
    const dx=puck.x-gx, dy=puck.y-gy, l=Math.hypot(dx,dy)||1;
    tx=puck.x+dx/l*6; ty=puck.y+dy/l*6;
    ms=Math.max(d.spd,8);
    if(spd>3.5 || --aiT<=0){ aiMode='normal'; stuck=0; }
  } else {
    const noise=(Math.random()*2-1)*d.err;
    if(puck.y < H/2+40){                      /* 攻撃: パックの裏に回り込んで打つ */
      const dx=puck.x-(gx+noise*1.5), dy=puck.y-gy, l=Math.hypot(dx,dy)||1;
      tx=puck.x+dx/l*8+noise*0.3;
      ty=puck.y+dy/l*8;
      ms=d.spd*d.atk;
      if(puck.y<aiP.y-6 && Math.abs(puck.x-aiP.x)<AR+PKR){   /* 自ゴール側に挟んだら横へ */
        tx=puck.x+(puck.x<W/2?1:-1)*(AR+PKR+8);
        ty=puck.y;
      }
    } else {                                  /* 防御: ホームで待ち構える */
      const predX=Math.max(PKR,Math.min(W-PKR, puck.x+puck.vx*10));
      tx=W/2+(predX-W/2)*0.5+noise; ty=homeY; ms=d.spd*0.85;
    }
    if(Math.random()>d.react){ tx=aiP.x; ty=aiP.y; }
  }
  calcVel(aiP,tx,ty,ms, AR,W-AR, AR+6,H/2-AR-2);
}

/* ---------- ゴール処理 ---------- */
function goal(byPlayer){
  state='goal'; flashT=80;
  if(byPlayer){ scoreP++; flashMsg='ゴール！';   jingle([784,988,1175,1568],75); }
  else        { scoreA++; flashMsg='しっぱい…'; jingle([330,262,196,131],110,'triangle'); }
  spawnParticles(puck.x,puck.y, byPlayer?'#5DCAA5':'#E24B4A', 30,7);
  shake=10;
  setTimeout(()=>{
    if(scoreP>=WIN || scoreA>=WIN){
      state='over';
      const win = scoreP>=WIN;
      overText.textContent = win ? 'きみの かち！' : 'CPUの かち';
      overText.className = 'result ' + (win?'win':'lose');
      overScore.textContent = scoreP+' - '+scoreA;
      overOverlay.hidden=false;
      if(win) jingle([523,659,784,1047,784,1047,1319],110);
      else    jingle([392,370,349,330,311,294,262],130,'triangle');
    } else { resetPuck(!byPlayer); state='play'; }
  },900);
}

/* ---------- 更新 ---------- */
function update(){
  if(shake>0) shake*=0.85;
  if(flashT>0) flashT--;
  if(hitCd>0) hitCd--;
  if(wallCd>0) wallCd--;
  particles=particles.filter(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.96; p.vy*=0.96; p.life-=0.03;
    return p.life>0;
  });
  if(state!=='play' || paused) return;

  calcVel(pl, pointer.x, pointer.y, 0, PR,W-PR, H/2+PR+2, H-PR-6);
  aiThink();

  /* 連続衝突判定: 相対速度に応じてサブステップ分割(すり抜け防止) */
  const rel=Math.max(
    Math.hypot(pl.vx -puck.vx, pl.vy -puck.vy),
    Math.hypot(aiP.vx-puck.vx, aiP.vy-puck.vy),
    Math.hypot(puck.vx, puck.vy));
  const n=Math.min(16, Math.max(1, Math.ceil(rel/(PKR*0.5))));
  for(let i=0;i<n;i++){
    pl.x +=pl.vx/n;  pl.y +=pl.vy/n;
    aiP.x+=aiP.vx/n; aiP.y+=aiP.vy/n;
    puck.x+=puck.vx/n; puck.y+=puck.vy/n;
    const g=wallsAndGoals();
    if(g){ goal(g==='goalP'); return; }
    collide(pl,PR); collide(aiP,AR);
  }
  puck.vx*=0.993; puck.vy*=0.993;
  trail.push({x:puck.x,y:puck.y});
  if(trail.length>10) trail.shift();
}

/* ---------- 描画 ---------- */
function circle(x,y,r,fill,stroke,lw){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw||3; ctx.stroke(); }
}
function draw(){
  ctx.save();
  if(shake>0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.fillStyle='#10182B'; ctx.fillRect(-10,-10,W+20,H+20);

  /* コート */
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  circle(W/2,H/2,60,null,'rgba(255,255,255,0.18)',2);
  const gl=(W-GOAL)/2, gr=(W+GOAL)/2;
  circle(W/2,0,90,null,'rgba(255,255,255,0.1)',2);
  circle(W/2,H,90,null,'rgba(255,255,255,0.1)',2);
  ctx.lineWidth=8; ctx.lineCap='round';
  ctx.strokeStyle='#534AB7';
  ctx.beginPath(); ctx.moveTo(gl,4);   ctx.lineTo(gr,4);   ctx.stroke();
  ctx.strokeStyle='#1D9E75';
  ctx.beginPath(); ctx.moveTo(gl,H-4); ctx.lineTo(gr,H-4); ctx.stroke();

  /* スコア */
  ctx.font='500 30px "DotGothic16", monospace'; ctx.textAlign='center';
  ctx.fillStyle='rgba(175,169,236,0.5)'; ctx.fillText(scoreA, W/2, H/2-22);
  ctx.fillStyle='rgba(93,202,165,0.5)';  ctx.fillText(scoreP, W/2, H/2+44);

  /* パックの残像 */
  trail.forEach((t,i)=>{
    ctx.globalAlpha=i/trail.length*0.25;
    circle(t.x,t.y, PKR*(i/trail.length), '#FFD93D');
  });
  ctx.globalAlpha=1;

  /* パーティクル */
  particles.forEach(p=>{ ctx.globalAlpha=p.life; circle(p.x,p.y,3.5,p.col); });
  ctx.globalAlpha=1;

  /* パドルとパック */
  circle(aiP.x,aiP.y,AR,'#3C3489','#AFA9EC',3);
  circle(aiP.x,aiP.y,AR*0.45,'#534AB7');
  circle(pl.x,pl.y,PR,'#085041','#5DCAA5',3);
  circle(pl.x,pl.y,PR*0.45,'#1D9E75');
  if(state!=='title') circle(puck.x,puck.y,PKR,'#FFD93D','#B8860B',2);

  /* ゴール演出 */
  if(flashT>0 && state==='goal'){
    ctx.fillStyle='rgba(16,24,43,0.5)'; ctx.fillRect(0,H/2-60,W,110);
    ctx.fillStyle='#FFD93D'; ctx.font='34px "DotGothic16", monospace';
    ctx.fillText(flashMsg, W/2, H/2);
  }
  /* 一時停止表示 */
  if(paused && state==='play'){
    ctx.fillStyle='rgba(16,24,43,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.font='22px "DotGothic16", monospace';
    ctx.fillText('いちじていし', W/2, H/2);
  }
  ctx.restore();
}

/* ---------- メインループ ---------- */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
})();
</script>
</body>
</html>
